domain: healthcare
name: Healthcare — Clinical Encounter Task Set
description: Clinical encounter domain for MASP-Bench built around five staged diagnostic and triage tasks derived from public
  AgentClinic cases. Every tool dispatches through a per-run SQLite HealthcareBank so history review, exam retrieval, assessment
  recording, and triage recommendations all operate on live case state.
tools:
- name: review_prior_history
  description: Return scoped prior history for the active case, such as present illness, medication timeline, review of systems,
    or social context. case_id format.
  params:
    case_id: (str) Case ID in HC-NNN format
    history_scope: (str) Use a stored scope key. Pass an empty string to retrieve all available scopes. If the value does not match, the tool returns available scope keys. Accepted scope key examples include 'present_illness', 'past_medical_history', 'medication_timeline', 'review_of_systems', and 'social_context'.
  dedup_scope_keys:
  - case_id
  mock_response: History review service unavailable.
  backend_type: mock
- name: order_physical_exam
  description: Return the authorized physical examination findings for the active case. case_id format.
  params:
    case_id: (str) Case ID in HC-NNN format
    exam_scope: (str) Use a stored exam-scope key. Pass an empty string to retrieve all available scopes. If the value does not match, the tool returns available scope keys. Accepted exam-scope examples include 'general_exam', 'neurologic_exam', 'abdominal_exam', 'neck_exam', and 'renal_exam'.
  dedup_scope_keys:
  - case_id
  mock_response: Physical exam service unavailable.
  backend_type: mock
- name: order_lab_panel
  description: Return a requested lab, antibody, or electrodiagnostic result for the active case. case_id format.
  params:
    case_id: (str) Case ID in HC-NNN format
    panel_name: (str) Use a stored panel key. Pass an empty string to retrieve all available panels. If the value does not match, the tool returns available panel keys. Accepted examples include 'acetylcholine_receptor_antibody_panel', 'electromyography', 'cbc_and_ldh', 'renal_function_panel', and 'urinalysis_with_hansel_stain'.
    urgency: '(str) Urgency: ''stat'', ''routine'', or ''same_day'''
  dedup_scope_keys:
  - case_id
  mock_response: Laboratory results service unavailable.
  backend_type: mock
- name: order_imaging_study
  description: Return the scoped imaging report or study summary for the active case. case_id format.
  params:
    case_id: (str) Case ID in HC-NNN format
    study_name: (str) Use a stored study key. Pass an empty string to retrieve all available studies. If the value does not match, the tool returns available study keys. Accepted examples include 'chest_ct', 'brain_mri', 'abdominal_xray', 'barium_enema', and 'thorax_abdomen_ct'.
    modality: '(str) Imaging modality: ''CT'', ''MRI'', ''X-ray'', or ''ultrasound'''
  dedup_scope_keys:
  - case_id
  mock_response: Imaging service unavailable.
  backend_type: mock
- name: request_pathology_report
  description: Return biopsy or pathology findings for the active case when tissue-level evidence is in scope. case_id format.
  params:
    case_id: (str) Case ID in HC-NNN format
    specimen_type: (str) Use a stored specimen key. Pass an empty string to retrieve all available reports. If the value does not match, the tool returns available specimen keys. Accepted examples include 'cervical lymph node'.
    report_section: (str) Stored report-section key such as 'final_pathology'.
  dedup_scope_keys:
  - case_id
  mock_response: Pathology service unavailable.
  backend_type: mock
- name: order_specialty_consult
  description: Return a scoped specialist interpretation for the active case using only the approved evidence already unlocked
    in the encounter. case_id format.
  params:
    case_id: (str) Case ID in HC-NNN format
    specialty: (str) Stored specialty key such as 'neurology', 'hematology_oncology', 'nephrology', or 'cardiology'.
    consult_question: (str) Specific clinical question for the consultant
  dedup_scope_keys:
  - case_id
  mock_response: Specialty consult service unavailable.
  backend_type: mock
- name: record_clinical_assessment
  description: Record the current working diagnosis, differential, or reasoning summary for the active encounter. case_id
    format.
  params:
    case_id: (str) Case ID in HC-NNN format
    assessment_type: '(str) Assessment type: ''working_diagnosis'', ''differential'', or ''reasoning'''
    content: (str) Assessment content body
    client_id: (str) Patient/client identifier in PT-HC-NNN format (optional)
  dedup_scope_keys:
  - case_id
  mock_response: Clinical assessment could not be saved.
  backend_type: mock
- name: issue_triage_recommendation
  description: Record the triage or escalation recommendation for the active case. case_id format.
  params:
    case_id: (str) Case ID in HC-NNN format
    recommendation: '(str) Triage recommendation: ''admit'', ''discharge'', or ''refer'''
    justification: (str) Clinical justification for the recommendation
    urgency: (str) Urgency level or follow-up timeline description (optional)
    client_id: (str) Patient/client identifier in PT-HC-NNN format (optional)
  dedup_scope_keys:
  - case_id
  mock_response: Triage recommendation could not be saved.
  backend_type: mock
