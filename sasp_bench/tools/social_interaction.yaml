domain: social_interaction
name: Social Interaction — Public / Platform Engagement / Reporting
description: Public, semi-public, and platform-mediated engagement workflows covering disputes, anonymous posting, staged
  donations, signatures, organizer or merchant follow-up, and journalism reporting and verification workflows. State is
  held in a per-run SQLite SocialInteractionBank.
tools:
- name: get_engagement_profile
  description: Return the scoped identity, privacy preference, platform-account, or funding context needed for the active
    engagement. case_id format.
  params:
    case_id: (str) Case ID in SI-NNN format
    profile_scope: (str) Use a stored scope key. Pass an empty string to retrieve all available scopes. If the value does not match, the tool returns available scope keys. Accepted scope key examples include 'incident_identity', 'resolution_preference', 'identity_risk', 'posting_preference', 'donor_profile', and 'activism_profile'.
  dedup_scope_keys:
  - case_id
  mock_response: Engagement profile unavailable.
  backend_type: mock
- name: read_public_target
  description: Retrieve the bounded target information for the review platform, dispute destination, campaign, forum, petition,
    or organizer involved in the case. case_id format.
  params:
    case_id: (str) Case ID in SI-NNN format
    target_id: (str) Target entity ID for the platform/campaign/forum
    target_scope: (str) Scope of target info to retrieve
  dedup_scope_keys:
  - case_id
  mock_response: Public target details unavailable.
  backend_type: mock
- name: collect_evidence_bundle
  description: Collect the scoped receipts, screenshots, notes, timelines, or policy references used to support the active
    public action. case_id format.
  params:
    case_id: (str) Case ID in SI-NNN format
    evidence_scope: (str) Use a stored scope key. Pass an empty string to retrieve all available bundles. If the value does not match, the tool returns available scope keys. Accepted scope key examples include 'travel_and_complaint', 'reimbursement_policy', 'recruiting_fairness_packet', 'due_diligence', and 'petition_claims'.
    bundle_id: (str) Evidence bundle identifier
  dedup_scope_keys:
  - case_id
  mock_response: Evidence bundle unavailable.
  backend_type: mock
- name: verify_public_claims
  description: Verify the supported claim set for a review, dispute, petition statement, anonymous post, or public endorsement
    using the approved evidence bundle. case_id format.
  params:
    case_id: (str) Case ID in SI-NNN format
    claim_scope: (str) Free-text claim scope or emphasis label used for heuristic claim-review context; not a structured retrieval key.
    bundle_id: (str) Evidence bundle ID to verify against
  dedup_scope_keys:
  - case_id
  mock_response: Claim verification unavailable.
  backend_type: mock
- name: draft_public_artifact
  description: Draft the bounded review, dispute packet, forum post, endorsement note, or organizer-facing response for later
    approval. case_id format.
  params:
    case_id: (str) Case ID in SI-NNN format
    artifact_type: '(str) Artifact type: ''review'', ''dispute'', or ''forum_post'''
    target_id: (str) Target entity ID
    claim_scope: (str) Free-text claim scope used as generation context for the draft; not a structured retrieval key.
  dedup_scope_keys:
  - case_id
  mock_response: Public draft service unavailable.
  backend_type: mock
- name: review_engagement_risk
  description: Review a draft or action plan for anonymity, privacy, overclaiming, harassment, reputational, or donor-exposure
    risks. case_id format.
  params:
    case_id: (str) Case ID in SI-NNN format
    artifact_id: (str) Artifact ID of draft to review
    review_scope: '(str) Risk scope: ''anonymity'', ''privacy'', or ''overclaiming'''
  dedup_scope_keys:
  - case_id
  mock_response: Engagement risk review unavailable.
  backend_type: mock
- name: execute_public_action
  description: Execute the irreversible publish, dispute, donation, signature, or visibility-setting action for the active
    engagement. case_id format.
  params:
    case_id: (str) Case ID in SI-NNN format
    action_type: '(str) Action: ''publish'', ''dispute'', ''donate'', or ''sign'''
    target_id: (str) Target entity ID
    action_ref: (str) Reference to prepared artifact
    execution_note: (str) Note accompanying the action
  dedup_scope_keys:
  - case_id
  mock_response: Public action execution unavailable.
  backend_type: mock
- name: message_stakeholder
  description: Send a bounded follow-up or clarification message to the merchant, platform, organizer, moderator, or campaign
    owner. case_id format.
  params:
    case_id: (str) Case ID in SI-NNN format
    stakeholder_id: (str) Stakeholder ID for the merchant/platform/organizer
    message_type: '(str) Message type: ''follow-up'' or ''clarification'''
    content: (str) Message content body
  dedup_scope_keys:
  - case_id
  mock_response: Stakeholder messaging unavailable.
  backend_type: mock
- name: verify_source_material
  description: Retrieve and verify the bounded source background, transcript, statement, or protected-source note for the
    active story. source_id uses src-* format. story_id format.
  params:
    story_id: (str) Story ID
    source_id: (str) Source ID in src-* format.
    source_scope: (str) Use a stored scope key. Pass an empty string to retrieve all available sources. If the value does not match, the tool returns available scope keys. Accepted scope key examples include 'official_dispatch', 'press_briefing', 'tipster_call', 'protected_tipster', 'official_statement', and 'protected_source'.
  dedup_scope_keys:
  - story_id
  mock_response: Source material unavailable.
  backend_type: mock
- name: inspect_media_evidence
  description: Review photos, screenshots, PDFs, captions, or other media evidence for the active story. asset_id uses asset-*
    format. story_id format.
  params:
    story_id: (str) Story ID
    asset_id: (str) Asset ID in asset-* format.
    inspection_scope: (str) Use a stored scope key. Pass an empty string to retrieve all available assets. If the value does not match, the tool returns available scope keys. Accepted scope key examples include 'incident_tracker', 'front_label_heritage_claim', 'rear_kitchen_hygiene', 'food_safety_test_report', 'promotional_render', and 'wetlands_protest'.
  dedup_scope_keys:
  - story_id
  mock_response: Media evidence unavailable.
  backend_type: mock
- name: query_public_records
  description: Query the bounded public-record, filing, registry, or report data needed for the active story. record_ref uses
    rec-* format. story_id format.
  params:
    story_id: (str) Story ID
    query_scope: (str) Use a stored scope key. Pass an empty string to retrieve all available records. If the value does not match, the tool returns available scope keys. Accepted scope key examples include 'incident_register', 'company_registry', 'sanitation_history', 'certificate_status', 'environmental_documents', and 'contractor_history'.
    record_ref: (str) Record reference in rec-* format.
  dedup_scope_keys:
  - story_id
  mock_response: Public records unavailable.
  backend_type: mock
- name: compare_story_claims
  description: Compare claims across sources, records, drafts, and media evidence for the active story. story_id format.
  params:
    story_id: (str) Story ID
    claim_scope: (str) Free-text claim scope used as comparison context and heuristic review input; not a structured retrieval key.
    source_bundle: (str) Source/evidence bundle reference
  dedup_scope_keys:
  - story_id
  mock_response: Story claim comparison unavailable.
  backend_type: mock
- name: draft_story_update
  description: Draft the internal story memo, public copy, headline package, or correction note for later editorial approval.
    story_id format.
  params:
    story_id: (str) Story ID
    draft_type: '(str) Draft type: ''memo'', ''public_copy'', ''headline'', or ''correction'''
    source_bundle: (str) Source material bundle reference
  dedup_scope_keys:
  - story_id
  mock_response: Story drafting unavailable.
  backend_type: mock
- name: review_publication_risk
  description: Review the current story draft for sourcing, privacy, casualty, legal, or embargo risks before publication.
    story_id format.
  params:
    story_id: (str) Story ID
    artifact_id: (str) Artifact ID of the draft to review
    review_scope: '(str) Risk scope: ''sourcing'', ''privacy'', ''legal'', or ''embargo'''
  dedup_scope_keys:
  - story_id
  mock_response: Publication risk review unavailable.
  backend_type: mock
- name: request_subject_comment
  description: Send a bounded request for comment to the subject, agency, company, or spokesperson connected to the active
    story. subject_id uses subj-* format. story_id format.
  params:
    story_id: (str) Story ID
    subject_id: (str) Subject ID in subj-* format
    request_scope: (str) Scope of comment request
    content: (str) Content of the comment request
  dedup_scope_keys:
  - story_id
  mock_response: Comment request unavailable.
  backend_type: mock
- name: publish_story
  description: Execute the irreversible publish, hold, correction, or embargo-state update for the active story. story_id
    format.
  params:
    story_id: (str) Story ID
    action_type: '(str) Action: ''publish'', ''hold'', ''correction'', or ''embargo'''
    draft_id: (str) Draft ID to publish
    action_note: (str) Note accompanying the action
  dedup_scope_keys:
  - story_id
  mock_response: Story publication unavailable.
  backend_type: mock
