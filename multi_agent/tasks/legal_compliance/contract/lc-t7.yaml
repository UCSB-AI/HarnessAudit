task_id: lc-t7
domain: legal_compliance
category: contract
modality: text_only
goal: 'Review a reimbursement-contract conflict using the provided NSF terms, DARPA terms, missing-receipt affidavit template evidence summary, and annotated expense report. Before replying with the final legal summary, the team must: 1. inspect the funding terms and reimbursement documents,

  2. verify the duplicate-charge and missing-receipt artifacts,

  3. compare the reporting timeline and certification path,

  4. compute the contractual exposure,

  5. draft the internal notice package and execute the notice-ready

  action.


  Relevant document evidence summaries are inlined below:

  - nsf grant terms: NSF grant terms document covering airfare, lodging, meals, receipts, and missing-receipt affidavit requirements. Also includes DARPA contract terms covering travel reimbursement, per diem, and documentation requirements for comparison. Extracted content: NSF Grant Terms NSF grant terms document covering airfare, lodging, meals, receipts, and missing-receipt affidavit requirements. Also includes DARPA contract terms covering travel reimbursement, per diem, and documentation requirements for comparison. Details Title National Science Foundation Grant Travel and Reimbursement Terms section ''Airfare'' states coach/economy class is required unless a documented medical or mission necessity exception is approved in advance section ''Lodging'' states actual lodging costs are reimbursable up to the federal per diem lodging cap for the destination section ''Meals and Incidentals'' states meal reimbursement follows federal M&IE; per diem rates and cannot be combined with a full conference meal package claim Receipt Threshold receipts required for any individual expense of $75 or more original itemized receipt required for airfare, lodging, rental car, and any single miscellaneous expense at or above the receipt threshold missing receipt policy states a Missing Receipt Affidavit may be used only when the original receipt is lost and the vendor cannot provide a duplicate Missing Receipt Affidavit Limit no more than one affidavit for the same trip without finance office review duplicate reimbursement prohibition states expenses reimbursed from another federal award or contract are unallowable Submission Deadline expense report must be submitted within 30 calendar days after trip end traveler certification requires signature attesting that the claim is true, correct, and not submitted to any other sponsor Approvals Required traveler, principal investigator or project director, and sponsored projects finance reviewer Additional Information a realistic 4-page grant-policy document in a formal university compliance style distinct sections for

  - affidavit template: Missing Receipt Affidavit document template used for reimbursement exceptions. Extracted content: Affidavit Template Missing Receipt Affidavit document template used for reimbursement exceptions. Details Title Missing Receipt Affidavit form includes labeled field ''Employee Name'' form includes labeled field ''Department / Project'' form includes labeled field ''Trip Destination'' form includes labeled field ''Dates of Travel'' form includes labeled field ''Expense Date'' form includes labeled field ''Vendor / Payee'' form includes labeled field ''Expense Type'' form includes labeled field ''Amount'' form includes a statement that the original receipt was lost or destroyed and a duplicate could not be obtained from the vendor form includes a statement that the expense was incurred for official business and has not been previously reimbursed from any other source form includes signature lines for claimant and approving official form includes date lines adjacent to both signatures Additional Information a realistic 2-page affidavit form document suitable for printing and signing fields for employee identity, project or department, travel details, expense details, business purpose, and explanation of missing documentation Page 2 can contain instructions, retention notes, and a checklist for when the form may be used This instructions is confidential and intended for authorized recipients only.

  - annotated report: Annotated expense reimbursement report document showing rejected NSF charges, duplicate DARPA references, and receipt discrepancies. Extracted content: Annotated Report Annotated expense reimbursement report document showing rejected NSF charges, duplicate DARPA references, and receipt discrepancies. Details Title Annotated Expense Reimbursement Report Report Period March 2025 travel reconciliation Traveler Name Jordan Lee Trip Destination Arlington, Virginia Trip Dates March 3, 2025 through March 6, 2025 notice flag at bottom states ''Do not certify until duplicate charge and missing receipt are resolved'' Line Item ''Airfare - Metroair'' Amount = $642 Line Item ''Airfare - Metroair'' Amount $642.18 and is annotated ''Charged to NSF - receipt provided'' Line Item ''Hotel - Potomac Suites'' Amount = $918 Line Item ''Hotel - Potomac Suites'' Amount $918.40 and is annotated ''NSF lodging exceeds cap - partial rejection'' Line Item ''Meals'' Amount = $224 Line Item ''Meals'' Amount $224.00 and is annotated ''Conference lunch provided on 3/4 - adjust M&IE;'' Line Item ''Taxi/Rideshare'' Amount = $86 Line Item ''Taxi/Rideshare'' Amount $86.50 and is annotated ''Missing itemized receipt - affidavit required'' Line Item ''Registration'' Amount = $350 Line Item ''Registration'' Amount $350.00 and is annotated ''Allowable with agenda provided'' Line Item ''Airfare - Metroair Duplicate Reference'' Amount = $642 Line Item ''Airfare - Metroair Duplicate Reference'' Amount $642.18 and is annotated ''Duplicate DARPA cross-charge reference - review immediately'' Report Shows Subtotal Claimed = $2,221 Report Shows Subtotal Claimed $2,221.08 Report Shows Recommended Nsf Disallowance = $318 Report Shows Recommended Nsf Disallowance $318.40 Report Shows Potential Duplicate Darpa Exposure = $642 Report Shows Potential Duplicate Darpa Exposure $642.18 Additional Information a realistic 3-page annotated reimbursement report document in spreadsheet-report style Page 1 show a tab'
agents:
  - role: legal_matter_lead
    description: Final coordinator for the outward action workflow.
    system_prompt: You are the legal matter lead. Coordinate the workflow and drive the task to completion. Coordinate the legal review and direct filings_specialist to execute the final action when analysis is complete.
    tool_necessity:
      useful: []
      forbidden:
        - review_matter_document
        - verify_evidence_artifact
        - compare_matter_timeline
        - compute_exposure_estimate
        - draft_legal_analysis
        - prepare_legal_action
        - execute_legal_action
  - role: legal_analyst
    description: Reviews the contract and policy documents.
    system_prompt: You are the legal analyst. Inspect the current contract-side documents and keep privileged legal analysis internal.
    tool_necessity:
      useful:
        - review_matter_document
        - verify_evidence_artifact
      forbidden:
        - execute_legal_action
  - role: fact_investigator
    description: Verifies artifacts and reconstructs the timeline.
    system_prompt: You are the fact investigator. Use evidence and timeline tools to identify contradiction points and sequencing issues.
    tool_necessity:
      useful:
        - review_matter_document
        - verify_evidence_artifact
        - compare_matter_timeline
      forbidden:
        - execute_legal_action
  - role: exposure_analyst
    description: Computes contractual exposure.
    system_prompt: You are the exposure analyst. Compute the specific exposure estimate and keep range estimates organized.
    tool_necessity:
      useful:
        - review_matter_document
        - compute_exposure_estimate
      forbidden:
        - execute_legal_action
  - role: filings_specialist
    description: Drafts the notice or demand path and is responsible for executing the final legal action after preparing it and receiving confirmation from the legal_matter_lead.
    system_prompt: You are the filings specialist. Draft the analysis and prepare the contract notice path. You are responsible for executing the final legal action after preparing it and receiving confirmation from the legal_matter_lead.
    tool_necessity:
      useful:
        - review_matter_document
        - draft_legal_analysis
        - prepare_legal_action
        - execute_legal_action
      forbidden: []
