    min_calls: 1
    weight: 0.1176
  - name: legal_theory_soundness
    type: llm_judge
    rubric: 'Evaluate the legal analysis for LC-007 (reimbursement-contract conflict, NSF vs. DARPA funding terms):

      1. Funding-rule distinction: Does the analysis correctly distinguish between nsf grant terms evidence summary (airfare, lodging, meals, receipt requirements, missing-receipt affidavit) and DARPA contract terms (travel reimbursement, per diem, documentation requirements) as separate compliance frameworks? (0.35)

      2. Violation classification: Does it classify each identified issue — rejected NSF charges, duplicate DARPA references, receipt discrepancies — as a potential fraud indicator, administrative error, or policy non-compliance, with reasoning for each? (0.35)

      3. Affidavit applicability: Does it assess whether the missing-receipt affidavit template evidence summary applies to the specific discrepancies found and under which funding source''s rules? (0.3)

      Return a single score 0-1.

      '
    weight: 0.1765
  - name: evidence_chain_completeness
    type: llm_judge
    rubric: 'Evaluate evidence utilization for LC-007 (reimbursement with NSF terms, DARPA terms, affidavit template evidence summary, and annotated report evidence summary):

      1. NSF terms analysis: Does it extract the specific reimbursement rules from nsf grant terms evidence summary (airfare caps, lodging limits, meal per diem, receipt thresholds, affidavit conditions) relevant to the flagged charges? (0.25)

      2. DARPA terms analysis: Does it extract the applicable rules from darpa_contract_terms.document (travel reimbursement rates, per diem caps, documentation requirements) and identify the duplicate-reference issue? (0.25)

      3. Annotated-report cross-reference: Does it systematically match each flagged item in annotated report evidence summary (rejected NSF charges, duplicate DARPA references, receipt discrepancies) to the specific funding-source rule it violates? (0.3)

      4. affidavit template evidence summary review: Does it review affidavit template evidence summary to determine what information is required for a valid missing-receipt exception and whether the current discrepancies qualify? (0.2)

      Return a single score 0-1.

      '
    weight: 0.1765
  - name: exposure_estimate_justification
    type: llm_judge
    rubric: 'Evaluate the exposure estimate for LC-007 (reimbursement compliance exposure):

      1. Dollar-amount specificity: Does the estimate quantify the total at-risk reimbursement amount by summing the rejected NSF charges, duplicate DARPA claims, and unsupported receipt items identified in the annotated report evidence summary? (0.4)

      2. Regulatory consequence: Does it assess the consequences beyond dollar recovery — e.g., audit escalation, grant suspension, debarment risk, or False Claims Act exposure for duplicate billing? (0.3)

      3. Remediation cost: Does it factor in the cost of remediation (affidavit preparation, corrected filings, internal investigation time) as part of the total exposure picture? (0.3)

      Return a single score 0-1.

      '
    weight: 0.1176
  - name: notice_package_appropriateness
    type: llm_judge
    rubric: 'Evaluate the notice package action for LC-007 (reimbursement dispute resolution):

      1. Corrective-action plan: Does the notice package include a specific corrective-action plan — which charges to reverse, which to support with affidavits, and which to reclassify between NSF and DARPA? (0.35)

      2. Documentation completeness: Does it specify what supporting documentation must be assembled (original receipts, affidavits, corrected expense reports, funding-source allocation worksheets) and assign responsibility? (0.35)

      3. Compliance-certification path: Does the action include a re-certification or re-submission step to the relevant grants/contracts office with a clear timeline? (0.3)

      Return a single score 0-1.

      '
    weight: 0.1766
