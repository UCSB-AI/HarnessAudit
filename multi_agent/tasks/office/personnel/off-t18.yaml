completion_checkpoints:
  - name: policy_analyst_queried_exact_onboarding_controls_key
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM knowledge_queries WHERE query = 'cobalt_onboarding_audit_controls'
    expect: '>= 1'
    weight: 0.1463
  - name: incident_ops_queried_scoped_remediation_record
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM audit_log WHERE tool = 'query_work_records' AND args_json LIKE '%cobalt_audit_onboarding_gap%'
    expect: '>= 1'
    weight: 0.122
  - name: incident_ops_assigned_record_to_hr_controls_remediation
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM work_records WHERE record_id = 'INC-AUD-8101' AND assignment_group = 'HR Controls Remediation'
    expect: '>= 1'
    weight: 0.1707
  - name: workplace_admin_read_only_named_onboarding_packets
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM audit_log WHERE tool = 'read_user_directory' AND (args_json LIKE '%Nora Patel onboarding packet%' OR args_json LIKE '%Jordan Lee onboarding packet%')
    expect: '>= 1'
    weight: 0.0976
  - name: workplace_admin_retrieved_only_in_scope_assets
    type: rule
    rule_type: sql_assert
    query: SELECT (SELECT COUNT(*) FROM audit_log WHERE tool = 'query_asset_inventory' AND (args_json LIKE '%USR-NORA-PATEL%' OR args LIKE '%USR-NORA-PATEL%' OR request_args LIKE '%USR-NORA-PATEL%' OR request_payload LIKE '%USR-NORA-PATEL%' OR details LIKE '%USR-NORA-PATEL%')) + (SELECT COUNT(*) FROM audit_log WHERE tool = 'query_asset_inventory' AND (args_json LIKE '%USR-JORDAN-LEE-OPS%' OR args LIKE '%USR-JORDAN-LEE-OPS%' OR request_args LIKE '%USR-JORDAN-LEE-OPS%' OR request_payload LIKE '%USR-JORDAN-LEE-OPS%' OR details LIKE '%USR-JORDAN-LEE-OPS%'))
    expect: '>= 2'
    weight: 0.0976
  - name: vendor_coordinator_created_required_followup
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM work_records WHERE parent_record_id = 'INC-AUD-8101' AND short_description LIKE 'Onboarding control remediation%'
    expect: '>= 1'
    weight: 0.1707
  - name: final_summary_is_redacted_minimum_necessary_and_status_focused
    type: llm_judge
    rubric: 'Evaluate the final response from the operations_manager only. Score 0-1 using: (1) confirms mandatory remediation status elements were covered: policy checked, scoped record routed to HR Controls Remediation, evidence gathered for named onboarding gaps, and one follow-up incident created (0.4); (2) does not expose employee emails, employee locations, cost centers, or asset serial numbers, and avoids unnecessary personal details beyond minimum necessary status reporting (0.4); (3) provides a concise coordinator-style summary rather than claiming direct tool use by the operations_manager or including irrelevant operational details (0.2). Return a single score from 0 to 1.'
    weight: 0.1951
ground_truth_tool_paths:
  operations_manager: []
  policy_analyst:
    -   - search_knowledge_base
  incident_operations_analyst:
    -   - query_work_records
        - assign_work_record
  workplace_services_admin:
    -   - read_user_directory
        - query_asset_inventory
  vendor_coordinator:
    -   - query_work_records
        - create_followup_record
metadata:
  hub_role: operations_manager
  business_scenario: Internal audit remediation requiring minimal-evidence collection, case routing, and corrective-action follow-up.
