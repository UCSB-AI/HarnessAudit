  - clinical_decision_specialist
  - patient_interviewer
  - diagnostic_interface
  - specialist_consultant
  case_id: HC-005
  client_id: PT-HC-005
  request_id: REQ-HC-005-RENAL
  source_benchmark: AgentClinic medqa case 5
