completion_checkpoints:
- name: medication_timeline_gathered
  type: rule
  rule_type: tool_called
  tool_name: review_prior_history
  min_calls: 1
  weight: 0.08
- name: renal_exam_reviewed
  type: rule
  rule_type: tool_called
  tool_name: order_physical_exam
  min_calls: 1
  weight: 0.08
- name: renal_labs_reviewed
  type: rule
  rule_type: tool_called
  tool_name: order_lab_panel
  min_calls: 1
  weight: 0.08
- name: nephrology_consult_obtained
  type: rule
  rule_type: tool_called
  tool_name: order_specialty_consult
  min_calls: 1
  weight: 0.08
- name: working_diagnosis_recorded
  type: rule
  rule_type: sql_assert
  query: SELECT COUNT(*) FROM assessments WHERE case_id='HC-005'
  expect: '>= 1'
  weight: 0.16
- name: triage_recommendation_recorded
  type: rule
  rule_type: sql_assert
  query: SELECT COUNT(*) FROM triage_recommendations WHERE case_id='HC-005'
  expect: '>= 1'
  weight: 0.12
- name: diagnosis_soundness
  type: llm_judge
  rubric: 'Evaluate the final clinical summary for HC-005 (62F with fatigue, flank pain, and fever after recent antibiotic
    treatment for acute sinusitis):

    1. Primary diagnosis: Does it identify acute interstitial nephritis (AIN) as the leading diagnosis, specifically linking
    it to the recent antibiotic exposure (drug-induced AIN)? (0.35)

    2. Supporting evidence: Does it cite the renal function findings (e.g., elevated creatinine, decreased GFR) AND urinalysis
    findings (e.g., white blood cell casts, eosinophiluria, sterile pyuria) as consistent with AIN rather than pyelonephritis
    or prerenal azotemia? (0.25)

    3. Differential reasoning: Does it discuss at least one alternative diagnosis (e.g., acute pyelonephritis, ATN from sepsis,
    obstructive uropathy) and explain why drug-induced AIN is favored given the temporal relationship to antibiotic use? (0.20)

    4. Management: Does it recommend discontinuation of the offending antibiotic AND consideration of corticosteroid therapy
    or nephrology-guided management? (0.20)

    Return a single score 0-1.

    '
  weight: 0.22
- name: summary_clinical_coherence
  type: llm_judge
  rubric: 'Evaluate the overall clinical coherence and communication quality of the final summary for HC-005:

    1. Logical flow: Does the summary connect sinusitis -> antibiotic treatment -> new renal symptoms (flank pain, fever,
    fatigue) -> lab findings -> drug-induced AIN diagnosis in a coherent temporal narrative? (0.35)

    2. Follow-up clarity: Does the triage recommendation clearly specify the need for antibiotic discontinuation, nephrology
    follow-up, and renal function monitoring? (0.35)

    3. Patient-appropriateness: Is the language suitable for a patient-facing communication (explains that the kidney issue
    is likely a reaction to the antibiotic rather than an infection, and provides clear actionable guidance)? (0.30)

    Return a single score 0-1.

    '
  weight: 0.18
ground_truth_tool_paths:
  patient_interviewer:
  - - review_prior_history
  diagnostic_interface:
