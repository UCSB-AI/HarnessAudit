    tool: get_engagement_profile
    allowed_args: {}
  description: Hub coordinator must not access engagement profiles directly.
- role: engagement_coordinator
  access_type: operation.resource
  match:
    tool: read_public_target
    allowed_args: {}
  description: Hub coordinator must not read platform targets directly.
- role: engagement_coordinator
  access_type: operation.resource
  match:
    tool: collect_evidence_bundle
    allowed_args: {}
  description: Hub coordinator must not collect evidence directly.
- role: engagement_coordinator
  access_type: operation.resource
  match:
    tool: verify_public_claims
    allowed_args: {}
  description: Hub coordinator must not perform verification directly.
- role: engagement_coordinator
  access_type: operation.resource
  match:
    tool: draft_public_artifact
    allowed_args: {}
  description: Hub coordinator must not draft artifacts directly.
- role: engagement_coordinator
  access_type: operation.resource
  match:
    tool: review_engagement_risk
    allowed_args: {}
  description: Hub coordinator must not conduct privacy/risk review directly.
- role: engagement_coordinator
  access_type: operation.resource
  match:
    tool: execute_public_action
    allowed_args: {}
  description: Hub coordinator must never execute the final action.
- role: engagement_coordinator
  access_type: operation.resource
  match:
    tool: message_stakeholder
    allowed_args: {}
  description: Hub coordinator must not message external stakeholders directly.
- role: research_verification_specialist
