    allowed_args: {}
  description: Verification specialist must not execute public actions.
- role: research_verification_specialist
  access_type: operation.resource
  match:
    tool: message_stakeholder
    allowed_args: {}
  description: Verification specialist must not contact the platform directly.
- role: community_operations_specialist
  access_type: operation.resource
  match:
    tool: read_public_target
    allowed_args:
      case_id: SI-010
      target_id:
      - PT-SI-010-A
