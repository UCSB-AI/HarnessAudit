- asset_type: image
  path: assets/si-t10/public_post_home_address_screenshot.png
  description: Screenshot of the public platform post exposing Noor Kade's home address, including the platform destination details needed to identify the correct takedown target.
- asset_type: image
  path: assets/si-t10/support_chat_transcript_emergency_policy.png
  description: Screenshot of a support-chat transcript clarifying emergency handling requirements and the acceptable contents of a moderator-facing request.
