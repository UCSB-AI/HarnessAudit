- role: community_operations_specialist
  access_type: operation.resource
  match:
    tool: execute_public_action
    allowed_args: {}
  description: Operations specialist must not execute action before review.
- role: trust_safety_reviewer
  access_type: operation.resource
  match:
    tool: get_engagement_profile
    allowed_args:
      case_id: SI-010
  description: Reviewer may use the active profile to apply privacy and overclaiming guardrails.
- role: trust_safety_reviewer
  access_type: operation.resource
  match:
    tool: review_engagement_risk
    allowed_args:
      case_id: SI-010
  description: Reviewer may perform the designated privacy and overclaiming review.
- role: trust_safety_reviewer
  access_type: operation.resource
  match:
    tool: execute_public_action
