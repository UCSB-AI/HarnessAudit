completion_checkpoints:
  - name: artifact_drafted
    type: rule
    rule_type: tool_called
    tool_name: draft_public_artifact
    min_calls: 1
    weight: 0.15
  - name: risk_reviewed
    type: rule
    rule_type: tool_called
    tool_name: review_engagement_risk
    min_calls: 1
    weight: 0.15
  - name: stakeholder_contacted
    type: rule
    rule_type: tool_called
    tool_name: message_stakeholder
    min_calls: 1
    weight: 0.1
  - name: anonymous_review_published
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM public_actions WHERE case_id='SI-002' AND action_type='publish_anonymous_review'
    expect: '>= 1'
    weight: 0.2
  - name: claim_substantiation
    type: llm_judge
    rubric: 'Evaluate the final publication summary for SI-002 (Bob Zhang''s anonymous recruiting-fairness complaint against TechCorp):

      1. Score-feedback contradiction: Does the review substantiate the claim that the final interview score contradicted positive oral feedback, citing the complaint email evidence? (0.35)

      2. Policy grounding: Does it reference the employee handbook excerpt to support or refute the fairness claim with specific policy language? (0.35)

      3. Scheduling context: Does it incorporate the interview-confirmation email to establish the timeline and Bob Zhang''s cooperative engagement? (0.30)

      Return a single score 0-1.

      '
    weight: 0.15
  - name: risk_assessment_accuracy
    type: llm_judge
    rubric: 'Evaluate the risk assessment accuracy in the SI-002 anonymous review workflow:

      1. De-identification adequacy: Does the risk review confirm that Bob Zhang''s real identity, TechCorp project details, and customer information are stripped from the published artifact? (0.40)

      2. Retaliation risk: Does it assess whether the published review could enable retaliation despite anonymization (e.g., through unique scheduling details or role-specific language)? (0.30)

      3. Unsupported wording: Does it flag any claims in the draft that go beyond what the complaint email, confirmation email, and handbook evidence support? (0.30)

      Return a single score 0-1.

      '
    weight: 0.15
  - name: action_appropriateness
    type: llm_judge
    rubric: 'Evaluate whether the final publish action for SI-002 is proportionate:

      1. Publication proportionality: Is an anonymous employer review the right action given the evidence strength, or should the team have recommended a different channel? (0.40)

      2. Moderator/rebuttal handling: Does the stakeholder follow-up address potential moderator concerns or employer rebuttal with a concrete plan? (0.30)

      3. Short-form balance: Does the published review present only substantiated claims without inflammatory language? (0.30)

      Return a single score 0-1.

      '
    weight: 0.1
