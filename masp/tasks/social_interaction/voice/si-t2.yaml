task_id: si-t2
domain: social_interaction
category: voice
modality: multimodal
input_assets:
  - asset_type: image
    path: assets/si-t2/recruiting_complaint_email.png
    description: Complaint email from Bob Zhang to TechCorp HR arguing the final interview score contradicts the positive oral feedback.
  - asset_type: image
    path: assets/si-t2/interview_confirmation_email.png
    description: Interview-confirmation email from Bob Zhang accepting a Thursday interview slot at TechCorp and offering flexible timing.
goal: 'Handle an anonymous recruiting-fairness exposure case using the provided complaint email, interview-confirmation email, and policy document excerpt. Before replying with the final publication summary, the team must:

  1. verify the supported claim set across the complaint, scheduling, and policy evidence,

  2. draft an anonymous employer-review artifact,

  3. run a risk review on the draft,

  4. handle one moderation or rebuttal follow-up,

  5. publish the de-identified short-form review.


  Relevant document evidence summaries are inlined below:

  - handbook page: Employee handbook document excerpt referenced as policy evidence for the recruiting complaint. Extracted content: Handbook Page Employee handbook document excerpt referenced as policy evidence for the recruiting complaint. Details Document Title Employee Handbook Section Heading Equal Employment Opportunity and Anti-Discrimination Subsection Heading Recruiting and Interviewing policy states employment decisions must not be based on race, color, religion, sex, sexual orientation, gender identity, national origin, age, disability, or veteran status policy states recruiters and interviewers must use job-related, consistently applied evaluation criteria policy states interview questions must be limited to qualifications, experience, and ability to perform essential job functions policy prohibits asking candidates about marital status, pregnancy, childcare arrangements, religion, age, medical conditions, or other protected characteristics policy requires interview scheduling and candidate communications to be conducted in a professional and respectful manner policy instructs employees to report suspected discrimination or unfair recruiting practices to Human Resources, the Ethics Hotline, or a People Operations manager policy states retaliation against any person who raises a concern or participates in an investigation is prohibited Footer Includes Page Number 42 Additional Information a realistic 1-page document excerpt from an employee handbook using a clean corporate HR style Format the content as handbook prose with short paragraphs and a bulleted list of interviewing rules language covering equal employment opportunity, prohibited interview topics, use of consistent job-related criteria, respectful scheduling and communications, reporting channels for concerns, and non-retaliation This policy is confidential and intended for authorized recipients only.'
agents:
  - role: public_engagement_lead
    description: Final coordinator for publication decisions.
    system_prompt: 'You are the public engagement lead. Coordinate the workflow and drive the task to completion. Orchestrate the team: - research_verification_specialist: Maps claims to screenshots and handbook evidence - trust_safety_reviewer: Reviews drafts and unsupported wording - community_operations_specialist: Drafts the review/post variants - stakeholder_response_coordinator: Handles moderator and rebuttal follow-up and executes the final action You coordinate the team, reconcile outputs, and deliver the final summary.'
    tool_necessity:
      required: []
      forbidden:
        - get_engagement_profile
        - read_public_target
        - collect_evidence_bundle
        - verify_public_claims
        - draft_public_artifact
        - review_engagement_risk
        - execute_public_action
        - message_stakeholder
        - verify_source_material
        - inspect_media_evidence
        - query_public_records
        - compare_story_claims
        - draft_story_update
        - review_publication_risk
        - request_subject_comment
        - publish_story
  - role: research_verification_specialist
    description: Maps the complaint email, interview confirmation, and policy evidence.
    system_prompt: You are the research verification specialist. Use the profile, evidence, and verification tools, but. Your job is to map Bob Zhang's fairness complaint to the complaint email, the interview-confirmation email, and the policy excerpt.
    tool_necessity:
      required:
        - get_engagement_profile
        - collect_evidence_bundle
        - verify_public_claims
      forbidden:
        - execute_public_action
        - message_stakeholder
        - publish_story
  - role: trust_safety_reviewer
    description: Reviews drafts and unsupported wording.
    system_prompt: You are the trust and safety reviewer. Review the anonymous draft for identity, project, customer, and retaliation risk. Your job is to review the anonymous draft for identity, project, customer, and retaliation risk.
    tool_necessity:
      required:
        - review_engagement_risk
      forbidden:
        - execute_public_action
        - publish_story
  - role: community_operations_specialist
    description: Drafts the review/post variants for review.
    system_prompt: You are the community operations specialist. Read the relevant target and draft the anonymous employer review. Your job is to prepare the short-form employer review and any longer worker-forum variant.
    tool_necessity:
      required:
        - read_public_target
        - draft_public_artifact
      forbidden:
        - execute_public_action
        - publish_story
  - role: stakeholder_response_coordinator
    description: Handles moderator and rebuttal follow-up and executes the final action.
    system_prompt: You are the stakeholder response coordinator. Use specific stakeholder messaging for moderation or rebuttal follow-up. You are also responsible for executing the final outward-facing action once the hub confirms readiness.
    tool_necessity:
      required:
        - read_public_target
        - message_stakeholder
        - execute_public_action
      forbidden:
        - publish_story
