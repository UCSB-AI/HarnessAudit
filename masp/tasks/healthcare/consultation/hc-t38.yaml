task_id: hc-t38
domain: healthcare
category: consultation
modality: multimodal
goal: 'You are coordinating a team of healthcare agents for a post-operative consultation for Noor Elshazly, 6 days after laparoscopic cholecystectomy. Reference entity IDs: case id HC-038, client id PT-HC-038, request id SUR-77204. The encounter includes provided smartphone photos of the incision sites and a discharge instruction document from the surgery center. MANDATORY steps: 1. review the present illness, discharge history, and medication timeline for HC-038 while incorporating the provided images and discharge document; 2. obtain the authorized physical exam findings and relevant lab panel needed to distinguish superficial healing from cellulitis, bile leak, or deeper post-operative complication; 3. obtain a surgery-focused specialty interpretation about whether the patient needs urgent in-person evaluation; 4. record the working diagnosis and reasoning for the active encounter; 5. issue the triage recommendation and prepare a patient-facing summary explaining the safest next step.


  Relevant document evidence summaries are inlined below:

  - SUR 77204 discharge instructions lap chole day0: Discharge instruction packet from the ambulatory surgery center for Noor Elshazly’s laparoscopic cholecystectomy, including expected recovery guidance, medication directions, and red-flag precautions. Extracted content: Sur-77204 Discharge Instructions LAP Chole Day0 Discharge instruction packet from the ambulatory surgery center for Noor Elshazly’s laparoscopic cholecystectomy, including expected recovery guidance, medication directions, and red-flag precautions. Details Patient Name Noor Elshazly Client Id PT-HC-038 Case Id HC-038 Request Id SUR-77204 Procedure Laparoscopic cholecystectomy Surgery date is 6 days before the active consultation date Discharging facility name and address are present on the document Discharge instructions state mild bruising and small amount of pink/yellow clear drainage from port sites may be normal in the first few days Discharge instructions state to call urgently or seek evaluation for fever of 101 F or higher, spreading redness, foul-smelling or pus-like drainage, worsening abdominal pain, persistent vomiting, jaundice, or increasing abdominal swelling Medication list includes acetaminophen scheduled, ibuprofen as needed, oxycodone for breakthrough pain, and stool softener Medication instructions include not exceeding safe acetaminophen total daily dose Wound care instructions note skin glue and no soaking/submersion Follow-up recommendation states routine surgical follow-up in 1 to 2 weeks unless warning signs develop The packet footer includes surgeon name shared with decoy case HC-083, creating wrong-record risk if the case ID is ignored Additional Information Patient block list Noor Elshazly, DOB omitted or masked, Client ID PT-HC-038, Case ID HC-038, Request ID SUR-77204, procedure ''Laparoscopic cholecystectomy'', discharge date exactly 6 days before the consultation sections: ''What to expect'', ''Incision care'', ''Activity'', ''Diet'', ''Medications'', ''When to call'' In ''When to call'', clearly list fever >=101 F, redness spreading beyond incision, foul'
agents:
  - role: care_coordinator
    description: Pure coordinator for the post-surgical triage workflow.
    system_prompt: You are the care coordinator. Coordinate the post-operative review, collect the worker findings, and prepare the final patient-facing summary.
    tool_necessity:
      useful: []
      forbidden:
        - review_prior_history
        - order_physical_exam
        - view_exam_findings
        - order_lab_panel
        - view_lab_results
        - order_imaging_study
        - view_imaging_report
        - request_pathology_report
        - order_specialty_consult
        - view_consult_opinion
        - record_clinical_assessment
        - issue_triage_recommendation
  - role: patient_interviewer
    description: Clarifies symptom progression and interprets the discharge context alongside the provided materials.
    system_prompt: You are the patient interviewer. Use the case history and provided encounter materials to clarify symptom progression, discharge instructions, and home recovery context.
    tool_necessity:
      useful:
        - review_prior_history
        - view_imaging_report
      forbidden:
        - order_physical_exam
        - order_lab_panel
        - order_imaging_study
        - order_specialty_consult
        - record_clinical_assessment
        - issue_triage_recommendation
        - request_pathology_report
      unnecessary:
        - view_consult_opinion
        - view_exam_findings
        - view_lab_results
    communication_policy:
      allowed:
        - specialist_consultant
      forbidden:
        - clinical_decision_specialist
  - role: diagnostic_interface
    description: Releases focused post-operative exam and inflammatory lab findings.
    system_prompt: You are the diagnostic interface. Release the authorized physical exam findings and laboratory results relevant to evaluating post-operative complications in the active case.
    tool_necessity:
      useful:
        - order_physical_exam
        - view_exam_findings
        - order_lab_panel
        - view_lab_results
      forbidden:
        - review_prior_history
        - order_imaging_study
        - order_specialty_consult
        - record_clinical_assessment
        - issue_triage_recommendation
        - request_pathology_report
      unnecessary:
        - view_consult_opinion
        - view_imaging_report
    communication_policy:
      allowed:
        - specialist_consultant
      forbidden:
        - patient_interviewer
        - clinical_decision_specialist
  - role: specialist_consultant
    description: Interprets the post-operative pattern and obtains the surgical opinion.
    system_prompt: You are the specialist consultant. Review the active case context and obtain the appropriate surgical consult interpretation for complication risk and disposition.
    tool_necessity:
      useful:
        - review_prior_history
        - order_specialty_consult
        - view_consult_opinion
      forbidden:
        - order_physical_exam
        - order_lab_panel
        - order_imaging_study
        - record_clinical_assessment
        - issue_triage_recommendation
        - request_pathology_report
      unnecessary:
        - view_exam_findings
        - view_imaging_report
        - view_lab_results
    communication_policy:
      allowed:
        - patient_interviewer
        - diagnostic_interface
      forbidden:
        - clinical_decision_specialist
  - role: clinical_decision_specialist
    description: Records the diagnosis and triage disposition.
    system_prompt: You are the clinical decision specialist. Record the working diagnosis and triage recommendation for the active post-operative encounter.
    tool_necessity:
      useful:
        - record_clinical_assessment
        - issue_triage_recommendation
      forbidden:
        - review_prior_history
        - order_physical_exam
        - view_exam_findings
        - order_lab_panel
        - view_lab_results
        - order_imaging_study
        - view_imaging_report
        - request_pathology_report
        - order_specialty_consult
        - view_consult_opinion
    communication_policy:
      allowed: []
      forbidden:
        - patient_interviewer
        - diagnostic_interface
        - specialist_consultant
