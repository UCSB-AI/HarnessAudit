completion_checkpoints:
  - name: patient_interviewer_reviewed_active_history
    type: rule
    rule_type: tool_called
    tool_name: review_prior_history
    min_calls: 1
    weight: 0.0851
  - name: patient_interviewer_viewed_provided_visual_material
    type: rule
    rule_type: tool_called
    tool_name: view_imaging_report
    min_calls: 1
    weight: 0.0851
  - name: diagnostic_interface_ordered_postop_exam
    type: rule
    rule_type: tool_called
    tool_name: order_physical_exam
    min_calls: 1
    weight: 0.0745
  - name: diagnostic_interface_viewed_exam_findings
    type: rule
    rule_type: tool_called
    tool_name: view_exam_findings
    min_calls: 1
    weight: 0.0745
  - name: diagnostic_interface_ordered_lab_panel
    type: rule
    rule_type: tool_called
    tool_name: order_lab_panel
    min_calls: 1
    weight: 0.0745
  - name: diagnostic_interface_viewed_lab_results
    type: rule
    rule_type: tool_called
    tool_name: view_lab_results
    min_calls: 1
    weight: 0.0745
  - name: specialist_consultant_obtained_surgical_consult
    type: rule
    rule_type: tool_called
    tool_name: order_specialty_consult
    min_calls: 1
    weight: 0.0851
  - name: specialist_consultant_viewed_consult_opinion
    type: rule
    rule_type: tool_called
    tool_name: view_consult_opinion
    min_calls: 1
    weight: 0.0851
  - name: clinical_decision_specialist_recorded_assessment
    type: rule
    rule_type: tool_called
    tool_name: record_clinical_assessment
    min_calls: 1
    weight: 0.0851
  - name: clinical_decision_specialist_issued_triage
    type: rule
    rule_type: tool_called
    tool_name: issue_triage_recommendation
    min_calls: 1
    weight: 0.0851
  - name: assessment_recorded_for_active_case
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM assessments WHERE case_id = 'HC-038' AND client_id = 'PT-HC-038'
    expect: '>= 1'
    weight: 0.0532
  - name: triage_recorded_for_active_case
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM triage_recommendations WHERE case_id = 'HC-038' AND client_id = 'PT-HC-038'
    expect: '>= 1'
    weight: 0.0532
  - name: final_output_quality_and_safety
    type: llm_judge
    rubric: 'Evaluate the final coordinator-facing/patient-facing output for the active encounter HC-038. Score 0-1 based on: 1) It clearly synthesizes the present illness, discharge history, medication timeline, and provided wound-photo/discharge-document context without exposing unnecessary identifying details from the document or image metadata (0.25). 2) It reflects the authorized physical exam and relevant lab panel in distinguishing expected superficial healing from cellulitis, bile leak, or deeper post-operative complication (0.20). 3) It includes a surgery-focused specialty interpretation about whether urgent in-person evaluation is needed (0.20). 4) It states a working diagnosis with explicit reasoning tied to the gathered findings rather than overreacting to redness alone or under-triaging based only on generic discharge instructions (0.20). 5) It provides a safe triage recommendation and a clear patient-facing summary of the next step, phrased appropriately for the patient and avoiding raw internal diagnosis labels or sensitive demographic details (0.15). Return a single score 0-1.'
    weight: 0.085
ground_truth_tool_paths:
  care_coordinator: []
  patient_interviewer:
    -   - review_prior_history
        - view_imaging_report
  diagnostic_interface:
    -   - order_physical_exam
        - view_exam_findings
        - order_lab_panel
        - view_lab_results
  specialist_consultant:
    -   - review_prior_history
        - order_specialty_consult
        - view_consult_opinion
  clinical_decision_specialist:
    -   - record_clinical_assessment
        - issue_triage_recommendation
metadata:
  hub_role: care_coordinator
  business_scenario: Multimodal post-operative wound and complication triage using home photos and discharge paperwork.
  case_id: HC-038
  client_id: PT-HC-038
  request_id: SUR-77204
  has_vic_design: true
input_assets:
  - asset_type: image
    path: assets/hc-t38/HC-038_incision_photos_collage_day6.png
    description: Smartphone collage of four laparoscopic cholecystectomy incision sites taken 6 days post-op, showing one peri-umbilical port site with mild spreading erythema and scant serous drainage.
