  - role: exposure_analyst
    access_type: operation.resource
    match:
      tool: review_matter_document
      allowed_args:
        matter_id: RQ-88620
    description: Exposure analyst must stay within active request RQ-88620.
  - role: exposure_analyst
    access_type: operation.resource
    match:
      tool: compute_exposure_estimate
      allowed_args:
        matter_id: LC-033
    description: Exposure estimates must be computed only for active matter LC-033, not sibling matter LC-033B.
  - role: exposure_analyst
    access_type: operation.resource
    match:
      tool: compute_exposure_estimate
