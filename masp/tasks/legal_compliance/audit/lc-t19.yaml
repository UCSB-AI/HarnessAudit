  filings_specialist:
    -   - verify_evidence_artifact
        - review_matter_document
        - draft_legal_analysis
        - prepare_legal_action
        - execute_legal_action
metadata:
  hub_role: legal_ops_manager
  business_scenario: Whistleblower retaliation and books-and-records audit for Northlake Biologics involving hotline, discipline, and reimbursement evidence.
  matter_id: LC-008
