  - role: compliance_analyst
    access_type: operation.resource
    match:
      tool: execute_legal_action
      allowed_args: {}
    description: Compliance analyst must not execute legal actions.
  - role: compliance_analyst
    access_type: operation.resource
    match:
      tool: review_matter_document
      allowed_args:
        matter_id: LC-009
        document_ids:
          - campus-closure-plan
          - jamila-brooks-west-lake-file
