completion_checkpoints:
  - name: maintenance_budget_retrieved
    type: rule
    rule_type: tool_called
    tool_name: query_expense_lines
    min_calls: 1
    weight: 0.15
  - name: exclusivity_policy_consulted
    type: rule
    rule_type: tool_called
    tool_name: search_knowledge_base
    min_calls: 1
    weight: 0.1
  - name: exception_record_routed
    type: rule
    rule_type: tool_called
    tool_name: assign_work_record
    min_calls: 1
    weight: 0.15
  - name: followup_record_created
    type: rule
    rule_type: tool_called
    tool_name: create_followup_record
    min_calls: 1
    weight: 0.15
  - name: maintenance_followup_exists
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM work_records WHERE category='Follow-up' AND short_description LIKE 'Maintenance exception%'
    expect: '>= 1'
    weight: 0.2
  - name: vendor_exception_risk_assessment
    type: llm_judge
    rubric: 'Evaluate the vendor exception risk assessment for VendorTech''s exclusive maintenance agreement:

      1. Exclusivity conflict: Did the team correctly identify that VendorTech''s mandatory 2-year exclusive maintenance clause violates the NSF prohibition on exclusive service agreements and potentially conflicts with DARPA''s no-vendor-conflicts-of-interest rule? (0.40)

      2. Compliant alternative: Did the team propose a compliant vendor-management path (e.g., rejecting the exclusivity clause, negotiating non-exclusive terms, or sourcing alternative maintenance providers) supported by the budget analysis from PARTNER-MAINT? (0.30)

      3. Risk quantification: Does the assessment articulate the operational and compliance risks of accepting the exclusive clause (e.g., vendor lock-in, audit exposure, grant non-compliance penalties)? (0.30)

      Return a single score 0-1.

      '
    weight: 0.15
  - name: exception_routing_quality
    type: llm_judge
    rubric: 'Evaluate the exception routing and follow-up for the VendorTech maintenance review:

      1. Routing correctness: Was INC-PART-7003 assigned to Legal Procurement Review, and does the follow-up record description start with "Maintenance exception"? (0.50)

      2. Alternative path clarity: Does the follow-up record describe a specific compliant alternative step (e.g., open competitive maintenance bid, request legal waiver review) rather than a vague next action? (0.50)

      Return a single score 0-1.

      '
    weight: 0.1
ground_truth_tool_paths:
  procurement_analyst:
    -   - query_expense_lines
        - optimize_budget_allocation
  policy_analyst:
    -   - search_knowledge_base
  vendor_coordinator:
    -   - query_work_records
        - assign_work_record
        - create_followup_record
metadata:
  category: partnership
  business_scenario: Exclusive maintenance clause exception review
  hub_role: operations_manager
  agents:
    - operations_manager
    - procurement_analyst
    - policy_analyst
    - vendor_coordinator
  difficulty: high
