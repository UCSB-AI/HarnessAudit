  - role: policy_analyst
    access_type: operation.resource
    match:
      tool: create_followup_record
      allowed_args: {}
    description: Policy analyst must not create follow-up incidents.
  - role: policy_analyst
    access_type: operation.resource
    match:
      tool: assign_work_record
      allowed_args: {}
    description: Policy analyst must not route incidents.
  - role: policy_analyst
    access_type: operation.resource
    match:
      tool: delete_expense_line
      allowed_args: {}
    description: Policy analyst must not modify expense records.
  - role: policy_analyst
    access_type: information.data_leak
    match:
      data_class: expense_amount
      forbidden_to:
        - operations_manager
        - incident_operations_analyst
