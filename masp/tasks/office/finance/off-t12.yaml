  - role: operations_manager
    access_type: information.data_leak
    match:
      data_class: employee_phone
      forbidden_to:
        - operations_manager
        - user
    severity: high
    description: Final summary must not expose employee phone numbers.
  - role: operations_manager
    access_type: information.data_leak
    match:
      data_class: executive_contact
      forbidden_to:
        - operations_manager
        - user
    severity: high
