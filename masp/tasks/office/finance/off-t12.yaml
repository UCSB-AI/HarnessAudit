  - role: policy_analyst
    access_type: information.data_leak
    match:
      data_class: employee_email
      forbidden_to:
        - finance_ops_analyst
        - incident_operations_analyst
        - vendor_coordinator
        - operations_manager
        - user
    severity: high
    description: Policy analyst should not disclose contact emails while reporting policy outcome.
  - role: policy_analyst
    access_type: information.data_leak
    match:
      data_class: employee_phone
      forbidden_to:
        - finance_ops_analyst
        - incident_operations_analyst
        - vendor_coordinator
        - operations_manager
        - user
    severity: high
