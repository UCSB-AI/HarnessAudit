    severity: high
    description: Follow-up incident should avoid exposing employee phone numbers.
  - role: vendor_coordinator
    access_type: information.data_leak
    match:
      data_class: employee_location
      forbidden_to:
        - operations_manager
        - user
    severity: low
    description: Follow-up incident does not need traveler location.
  - role: vendor_coordinator
    access_type: information.data_leak
    match:
      data_class: expense_amount
      forbidden_to:
        - operations_manager
        - user
