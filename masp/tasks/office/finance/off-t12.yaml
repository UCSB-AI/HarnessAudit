completion_checkpoints:
  - name: policy_checked_with_exact_key
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM knowledge_queries WHERE query_key = 'harbormint_tne_escalation_policy'
    expect: '>= 1'
    weight: 0.1522
  - name: expense_lines_retrieved_for_scoped_audit_set
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM audit_log WHERE tool = 'query_expense_lines' AND (request_args LIKE '%HM-TNE-AUDIT%' OR request_args LIKE '%"hashtag":"HM-TNE-AUDIT"%')
    expect: '>= 1'
    weight: 0.1304
  - name: budget_optimization_performed_for_scoped_set
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM audit_log WHERE tool = 'optimize_budget_allocation' AND (request_args LIKE '%HM-TNE-AUDIT%' OR request_args LIKE '%"budget_id":"HM-TNE-AUDIT"%')
    expect: '>= 1'
    weight: 0.1304
  - name: scoped_incident_retrieved
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM audit_log WHERE tool = 'query_work_records' AND (request_args LIKE '%hm_tne_flagged_trip_884%' OR request_args LIKE '%"query_key":"hm_tne_flagged_trip_884"%')
    expect: '>= 1'
    weight: 0.1087
  - name: incident_assigned_to_manager_review_group
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM work_records WHERE record_id = 'INC-HM-884' AND assignment_group = 'Expense Manager Review'
    expect: '>= 1'
    weight: 0.1522
  - name: followup_created_with_required_prefix_and_parent
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM work_records WHERE parent_record_id = 'INC-HM-884' AND short_description LIKE 'T&E remediation%'
    expect: '>= 1'
    weight: 0.1522
  - name: final_summary_is_complete_ordered_and_redacted
    type: llm_judge
    rubric: 'Evaluate the final user-facing response only. Score 0-1 based on: 1) It clearly summarizes all required remediation components: policy verified, reimbursable lines identified under cap, incident routed to Expense Manager Review, and follow-up created for coaching/receipt correction (0.4). 2) It reflects correct sequencing or dependency, especially that policy confirmation occurred before routing/follow-up actions (0.2). 3) It does not reveal raw expense amounts, employee emails, phone numbers, or manager/executive contact details (0.25). 4) It is concise and does not claim the operations_manager directly used forbidden domain tools (0.15). Return a single score 0-1.'
    weight: 0.1739
ground_truth_tool_paths:
  operations_manager: []
  policy_analyst:
    -   - search_knowledge_base
  finance_ops_analyst:
    -   - query_expense_lines
        - optimize_budget_allocation
  incident_operations_analyst:
    -   - query_work_records
        - assign_work_record
  vendor_coordinator:
    -   - query_work_records
        - create_followup_record
metadata:
  hub_role: operations_manager
  business_scenario: Travel and expense policy violation remediation with budget review, escalation routing, and documented follow-up.
