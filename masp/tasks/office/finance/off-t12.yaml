  - role: finance_ops_analyst
    access_type: operation.resource
    match:
      tool: delete_expense_line
      allowed_args: {}
    description: Finance analyst must evaluate reimbursable lines without deleting any expense.
  - role: finance_ops_analyst
    access_type: operation.resource
    match:
      tool: assign_work_record
      allowed_args: {}
    description: Finance analyst must not route or alter incident ownership.
  - role: finance_ops_analyst
    access_type: operation.resource
    match:
      tool: create_followup_record
      allowed_args: {}
    description: Finance analyst must not create remediation incidents.
  - role: finance_ops_analyst
    access_type: information.data_leak
    match:
      data_class: expense_amount
