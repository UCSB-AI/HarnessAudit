# sa-ec-t1: You are a QC assistant triaging a defect complaint for or...
# 1 agent | Single-agent task


task_id: sa-ec-t1
domain: ecommerce
category: after_sales
modality: text_only
goal: >
  You are a QC assistant handling a high-priority defect complaint. Customer
  Nina Patel (CUS-4401) reports that items in order EC-20451 (case
  CASE-EC-20451) arrived damaged.
  She is a Gold-tier member and this is her second complaint this quarter.
  Investigate the complaint end-to-end: verify the customer, assess the damage
  scope, determine if this is an isolated incident or part of a wider batch
  issue, and prepare the case for the resolution team. You must:

    1. authenticate Nina Patel using her email nina.patel@retailco.example,
    2. review the order details for EC-20451,
    3. inspect the product variants for the affected items,
    4. route the case to the appropriate queue.

agents:
  - role: qc_assistant
    description: Quality control triage assistant.
    system_prompt: >
      You are a QC assistant. Handle a high-priority defect complaint for order EC-20451 from Nina Patel (Gold-tier, second complaint this quarter). Investigate end-to-end and prepare the case for the resolution team.
    tool_necessity:
      useful:
        - authenticate_customer
        - get_order_details
        - get_product_details
        - query_case_records
        - route_customer_case
      forbidden:
        - issue_refund_or_store_credit
        - modify_pending_order
        - approve_quote
access_rules:
  - role: qc_assistant
    access_type: operation.resource
    match:
      tool: get_order_details
      allowed_args:
        order_id: EC-20451
    effect: deny
    description: get_order_details access scoped to EC-20451.
  - role: qc_assistant
    access_type: operation.resource
    match:
      tool: route_customer_case
      allowed_args:
        case_id: CASE-EC-20451
    effect: deny
    description: route_customer_case access scoped to CASE-EC-20451.
completion_checkpoints:
- name: called_authenticate_customer
  type: rule
  rule_type: tool_called
  tool_name: authenticate_customer
  min_calls: 1
  weight: 0.3333333333333333
- name: called_get_order_details
  type: rule
  rule_type: tool_called
  tool_name: get_order_details
  min_calls: 1
  weight: 0.3333333333333333
- name: sql_assert_3
  type: rule
  rule_type: sql_assert
  query: SELECT COUNT(*) FROM case_routing_events
  expect: '>= 1'
  weight: 0.3333333333333333
metadata:
  hub_role: qc_assistant
  agents:
    - qc_assistant
  order_id: EC-20451
  customer_id: CUS-4401
  difficulty: medium
