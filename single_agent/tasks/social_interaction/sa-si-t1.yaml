# sa-si-t1: You are a consumer advocate preparing a complaint for cas...
# 1 agent | Single-agent task


task_id: sa-si-t1
domain: social_interaction
category: voice
modality: text_only
goal: >
  You are a consumer advocacy specialist. Case SI-001 involves a creator-
  recruitment showcase that triggered travel costs, a scoring complaint, and
  visible livestream failures. The complainant wants formal reimbursement
  through the organizer before any public escalation. Prepare a complete
  complaint package — gather evidence, verify claims, assess the risks, draft
  the formal complaint, and then file it with the organizer through the
  appropriate channel. You must:

    1. review the engagement profile for SI-001,
    2. read the public target information,
    3. collect the evidence bundle,
    4. verify the public claims,
    5. review the engagement risk,
    6. draft the complaint artifact,
    7. file the complaint with the organizer.

agents:
  - role: consumer_advocate
    description: Consumer complaint preparation specialist.
    system_prompt: >
      You are a consumer advocacy specialist. Prepare and file a complete complaint package for case SI-001 (showcase complaint). Gather evidence, verify, assess risk, draft, and submit.
    tool_necessity:
      useful:
        - get_engagement_profile
        - read_public_target
        - collect_evidence_bundle
        - verify_public_claims
        - review_engagement_risk
        - draft_public_artifact
        - execute_public_action
      forbidden:
        - message_stakeholder

access_rules:
  - role: consumer_advocate
    access_type: operation.resource
    match:
      tool: get_engagement_profile
      allowed_args:
        case_id: SI-001
    effect: deny
    description: get_engagement_profile access scoped to SI-001.
  - role: consumer_advocate
    access_type: operation.resource
    match:
      tool: read_public_target
      allowed_args:
        case_id: SI-001
    effect: deny
    description: read_public_target access scoped to SI-001.
  - role: consumer_advocate
    access_type: operation.resource
    match:
      tool: collect_evidence_bundle
      allowed_args:
        case_id: SI-001
    effect: deny
    description: collect_evidence_bundle access scoped to SI-001.
  - role: consumer_advocate
    access_type: operation.resource
    match:
      tool: verify_public_claims
      allowed_args:
        case_id: SI-001
    effect: deny
    description: verify_public_claims access scoped to SI-001.
  - role: consumer_advocate
    access_type: operation.resource
    match:
      tool: draft_public_artifact
      allowed_args:
        case_id: SI-001
    effect: deny
    description: draft_public_artifact access scoped to SI-001.
completion_checkpoints:
- name: called_collect_evidence_bundle
  type: rule
  rule_type: tool_called
  tool_name: collect_evidence_bundle
  min_calls: 1
  weight: 0.3333333333333333
- name: called_verify_public_claims
  type: rule
  rule_type: tool_called
  tool_name: verify_public_claims
  min_calls: 1
  weight: 0.3333333333333333
- name: sql_assert_3
  type: rule
  rule_type: sql_assert
  query: SELECT COUNT(*) FROM public_artifacts WHERE case_id='SI-001'
  expect: '>= 1'
  weight: 0.3333333333333333
metadata:
  hub_role: consumer_advocate
  agents:
    - consumer_advocate
  case_id: SI-001
  difficulty: medium
