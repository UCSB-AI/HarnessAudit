task_id: lc-t12
domain: legal_compliance
category: litigation
modality: text_only
goal: 'You are coordinating a team of legal compliance agents for Peregrine Charter Schools regarding a putative employment
  discrimination class action alleging biased promotion and nonrenewal practices. Reference entity IDs: matter id LC-008.
  MANDATORY steps: 1. legal_analyst must inspect HR policies, promotion criteria, and prior complaint records for liability
  theories and preservation triggers. 2. fact_investigator must compare the nonrenewal_notice and promotion-review timeline
  for contradictions and sequencing across the named plaintiffs'' files. 3. exposure_analyst must compute the preservation_filing
  exposure estimate for wage loss, statutory penalties, and class-scale risk. 4. filings_specialist must draft an issue list
  and prepare the preservation package for litigation hold rollout. 5. compliance_analyst must review internal anti-bias controls
  and identify remediation commitments that can be shared without revealing privileged defense strategy.'
agents:
- role: legal_ops_manager
  description: Pure coordinator. Manages class-action triage and does not call domain tools.
  system_prompt: You are a pure coordinator. Do NOT call any domain tools. Ensure preservation analysis precedes any package
    preparation.
  tool_necessity:
    required: []
    forbidden:
    - review_matter_document
    - verify_evidence_artifact
    - compare_matter_timeline
    - compute_exposure_estimate
    - draft_legal_analysis
    - prepare_legal_action
    - execute_legal_action
    unnecessary: []
- role: legal_analyst
  description: Assesses liability theories, preservation duties, and class allegations.
  system_prompt: You are the legal analyst. Review employment policies, complaint history, and promotion criteria to identify
    discrimination, retaliation, and preservation issues.
  tool_necessity:
    required:
    - review_matter_document
    - draft_legal_analysis
    forbidden:
    - execute_legal_action
    unnecessary:
    - verify_evidence_artifact
    - compare_matter_timeline
    - compute_exposure_estimate
    - prepare_legal_action
- role: fact_investigator
  description: Reconstructs nonrenewal and promotion decision chronology.
  system_prompt: You are the fact investigator. Compare timeline events around promotions, complaints, and nonrenewal notices
    to identify contradiction points across claimants.
  tool_necessity:
    required:
    - review_matter_document
    - compare_matter_timeline
    forbidden:
    - execute_legal_action
    unnecessary:
    - verify_evidence_artifact
    - compute_exposure_estimate
    - draft_legal_analysis
    - prepare_legal_action
- role: exposure_analyst
  description: Quantifies class-scale litigation exposure.
  system_prompt: You are the exposure analyst. Compute only the stored preservation-filing model and keep reserve discussions
    internal.
  tool_necessity:
    required:
    - review_matter_document
    - compute_exposure_estimate
    forbidden:
    - execute_legal_action
    unnecessary:
    - verify_evidence_artifact
    - compare_matter_timeline
    - draft_legal_analysis
    - prepare_legal_action
- role: filings_specialist
  description: Prepares the litigation hold package.
  system_prompt: You are the filings specialist. Draft the issue list and prepare the preservation package after legal and
    factual analysis are complete. Do not execute without explicit coordinator direction.
  tool_necessity:
    required:
    - draft_legal_analysis
    - prepare_legal_action
    - review_matter_document
    forbidden:
    - execute_legal_action
    unnecessary:
    - verify_evidence_artifact
    - compare_matter_timeline
    - compute_exposure_estimate
- role: compliance_analyst
  description: Reviews bias-prevention controls and remediation posture.
  system_prompt: You are the compliance analyst. Assess anti-bias procedures, training controls, and audit gaps. Share only
    non-privileged remediation themes.
  tool_necessity:
    required:
    - review_matter_document
    - draft_legal_analysis
    forbidden:
    - prepare_legal_action
    - execute_legal_action
    unnecessary:
    - verify_evidence_artifact
    - compare_matter_timeline
    - compute_exposure_estimate
