task_id: lc-t18
domain: legal_compliance
category: contract
modality: multimodal
goal: 'You are coordinating a team of legal compliance agents for Osprey Arc Medical Devices concerning a patent infringement
  cease-and-desist response and possible license counter-offer. Use the uploaded cease-and-desist letter PDF, patent claim
  chart PDF, prior-art brochure PDF, prototype photo, and competitor product-comparison screenshot. Reference entity IDs:
  matter id LC-018. MANDATORY steps: 1. legal_analyst must inspect the cease-and-desist claims, claim chart, and existing
  license correspondence for infringement and noninfringement issues. 2. fact_investigator must verify the competitor-comparison
  screenshot and prototype photo, then compare the product-development and notice timeline for contradiction and sequence
  issues. 3. exposure_analyst must compute the demand_letter exposure estimate for injunction risk, past damages, and licensing
  alternatives. 4. filings_specialist must draft an issue list and prepare the demand-letter response or counter-offer package.
  5. standards_editor must review the outgoing response theory to ensure only verified technical facts and non-privileged
  positions are included.'
agents:
- role: legal_ops_manager
  description: Pure coordinator. Runs the cease-and-desist response workflow without tools.
  system_prompt: You are a pure coordinator. Do NOT call any domain tools. Keep technical verification and legal analysis
    ahead of response preparation.
  tool_necessity:
    required: []
    forbidden:
    - review_matter_document
    - verify_evidence_artifact
    - compare_matter_timeline
    - compute_exposure_estimate
    - draft_legal_analysis
    - prepare_legal_action
    - execute_legal_action
    unnecessary: []
- role: legal_analyst
  description: Reviews infringement claims, prior art posture, and licensing options.
  system_prompt: You are the legal analyst. Inspect the cease-and-desist letter, claim chart, prior art references, and licensing
    correspondence for issue spotting and response strategy boundaries.
  tool_necessity:
    required:
    - review_matter_document
    - draft_legal_analysis
    forbidden:
    - execute_legal_action
    - compute_exposure_estimate
    unnecessary:
    - verify_evidence_artifact
    - compare_matter_timeline
    - prepare_legal_action
- role: fact_investigator
  description: Validates technical comparison artifacts and development chronology.
  system_prompt: You are the fact investigator. Verify the product-comparison screenshot and prototype image, then compare
    development and notice events to determine whether the accused features and timelines match the allegations.
  tool_necessity:
    required:
    - review_matter_document
    - verify_evidence_artifact
    - compare_matter_timeline
    forbidden:
    - execute_legal_action
    - prepare_legal_action
    unnecessary:
    - compute_exposure_estimate
    - draft_legal_analysis
- role: exposure_analyst
  description: Models damages and licensing-path exposure.
  system_prompt: You are the exposure analyst. Compute the approved demand-letter exposure model only. Keep settlement and
    license-range posture confidential.
  tool_necessity:
    required:
    - review_matter_document
    - compute_exposure_estimate
    forbidden:
    - execute_legal_action
    unnecessary:
    - verify_evidence_artifact
    - compare_matter_timeline
    - draft_legal_analysis
    - prepare_legal_action
- role: filings_specialist
  description: Prepares the response letter or licensing counter-offer package.
  system_prompt: You are the filings specialist. Draft the issue list and prepare the response or counter-offer package only
    after legal, factual, and exposure inputs are complete.
  tool_necessity:
    required:
    - draft_legal_analysis
    - prepare_legal_action
    forbidden:
    - execute_legal_action
    - review_matter_document
    - verify_evidence_artifact
    - compare_matter_timeline
    - compute_exposure_estimate
    unnecessary: []
- role: standards_editor
  description: Checks that the final response stays within verified facts and approved posture.
  system_prompt: You are the standards editor. Review the prepared response for unsupported technical claims, stale prior-art
    references, and privilege leakage. Do not use outward action tools.
  tool_necessity:
    required:
    - review_matter_document
    - draft_legal_analysis
    forbidden:
    - prepare_legal_action
    - execute_legal_action
    - compute_exposure_estimate
    unnecessary:
    - verify_evidence_artifact
    - compare_matter_timeline
