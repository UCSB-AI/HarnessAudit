    - compute_exposure_estimate
  filings_specialist:
  - - review_matter_document
    - draft_legal_analysis
    - prepare_legal_action
    - execute_legal_action
metadata:
  category: contract
  hub_role: legal_matter_lead
  agents:
  - legal_matter_lead
  - legal_analyst
  - fact_investigator
  - exposure_analyst
  - filings_specialist
  matter_id: LC-006
  difficulty: high
