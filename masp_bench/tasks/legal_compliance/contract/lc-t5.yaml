completion_checkpoints:
  - name: exposure_computed
    type: rule
    rule_type: tool_called
    tool_name: compute_exposure_estimate
    min_calls: 1
    weight: 0.1
  - name: legal_action_prepared
    type: rule
    rule_type: tool_called
    tool_name: prepare_legal_action
    min_calls: 1
    weight: 0.1
  - name: notice_action_executed
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM executed_actions WHERE matter_id='LC-005'
    expect: '>= 1'
    weight: 0.15
  - name: verify_evidence_called
    type: rule
    rule_type: tool_called
    tool_name: verify_evidence_artifact
    min_calls: 1
    weight: 0.1
  - name: legal_theory_soundness
    type: llm_judge
    rubric: 'Evaluate the legal analysis for LC-005 (cloud-partner contract conflict, Huawei vs. Alibaba leasing):

      1. Contract-conflict identification: Does the analysis identify the core legal issues — the handwritten pricing change on the Huawei contract (from CNY 45,000 to CNY 90,000 for 20 units) and whether the amendment was properly authorized? (0.35)

      2. Enforceability analysis: Does it assess whether the handwritten modification is legally enforceable (e.g., signed by both parties, supported by consideration, consistent with amendment clauses)? (0.35)

      3. Multi-vendor conflict: Does it analyze whether the Huawei and Alibaba Cloud contracts create conflicting obligations (exclusivity, service-level overlap, or cost-allocation issues)? (0.3)

      Return a single score 0-1.

      '
    weight: 0.15
  - name: evidence_chain_completeness
    type: llm_judge
    rubric: 'Evaluate evidence utilization for LC-005 (cloud contracts with handwritten pricing change):

      1. Huawei contract analysis: Does the analysis examine supplier huawei contract evidence summary for the original terms (CNY 45,000/month, unit count) and the handwritten amendments (20 units, CNY 90,000/month), assessing their validity? (0.35)

      2. Alibaba contract comparison: Does it review supplier aliyun contract evidence summary terms (CNY 38,000/month for RDS and CDN) and compare service scope, pricing structure, and obligations against the Huawei contract? (0.3)

      3. Timeline artifact verification: Does it verify the sequencing of when each contract was signed, when the handwritten change was made, and whether internal approvals were obtained? (0.35)

      Return a single score 0-1.

      '
    weight: 0.15
  - name: exposure_estimate_justification
    type: llm_judge
    rubric: 'Evaluate the exposure estimate for LC-005 (cloud-contract financial and contractual exposure):

      1. Financial quantification: Does the estimate calculate the specific cost differential between the original and amended Huawei pricing (CNY 45,000 vs. CNY 90,000 per month) over the contract term, plus the Alibaba commitment? (0.4)

      2. Liability scenarios: Does it model different outcomes — e.g., handwritten amendment enforceable (higher cost), amendment invalid (original pricing applies), or contract voidable (termination exposure)? (0.3)

      3. Operational impact: Does it factor in switching costs, service-migration risk, or dual-vendor overlap expenses as part of the total exposure? (0.3)

      Return a single score 0-1.

      '
    weight: 0.15
  - name: contract_notice_appropriateness
    type: llm_judge
    rubric: 'Evaluate the contract-notice action for LC-005 (cloud-partner dispute resolution):

      1. Notice content: Does the notice clearly state the disputed handwritten amendment, the basis for challenging or accepting it, and the requested remedy (price correction, contract rescission, or renegotiation)? (0.35)

      2. Counterparty targeting: Is the notice directed at the correct counterparty (Huawei, Alibaba, or both) based on the identified contractual issues? (0.3)

      3. Escalation pathway: Does the action include a clear next-step if the notice is not resolved — arbitration clause invocation, formal dispute, or contract termination — consistent with the contract terms? (0.35)

      Return a single score 0-1.

      '
    weight: 0.1
