task_id: lc-t5
domain: legal_compliance
category: contract
modality: text_only
goal: 'Review a cloud-partner contract conflict using the attached Huawei and Alibaba leasing contracts. Before replying with the final legal summary, the team must: 1. inspect the two contract versions and related internal matter

  documents,

  2. verify the handwritten pricing-change artifact and compare the

  timeline,

  3. compute the contractual exposure,

  4. draft the internal issue list and prepare the contract-notice path,

  5. execute the notice-ready action.


  Document evidence summaries now inlined because original document attachments were removed:

  - supplier huawei contract: Cloud Server Leasing Contract document for Huawei ECS services showing a monthly fee of CNY 45,000 with handwritten changes to 20 units and CNY 90,000 per month. Extracted content: Supplier Huawei Contract Cloud Server Leasing Contract document for Huawei ECS services showing a monthly fee of CNY 45,000 with handwritten changes to 20 units and CNY 90,000 per month. Details Document Title Cloud Server Leasing Contract Service Type Elastic Cloud Server (ECS) leasing Original Monthly Fee CNY 45,000 Handwritten Unit Quantity 20 units Handwritten Revised Monthly Fee CNY 90,000 per month pricing_table contains a line item for ECS resources document contains visible handwritten modifications near the pricing section contract includes signature blocks for both supplier and customer Currency Used CNY Provider Name = Huawei Cloud Computing Technologies Co Provider Name Huawei Cloud Computing Technologies Co., Ltd. Additional Information a realistic 3-page Chinese-style commercial contract document using reportlab a pricing section with a clean table and leave visible evidence of manual edits in the fee area: simulate handwritten annotations and strike/replace marks near unit quantity and monthly total so the revised values are visually distinguishable from the printed text This contract is confidential and intended for authorized recipients only.

  - supplier aliyun contract: Cloud Service Leasing Contract document for Alibaba Cloud RDS and CDN services at CNY 38,000 per month. Extracted content: Supplier Aliyun Contract Cloud Service Leasing Contract document for Alibaba Cloud RDS and CDN services at CNY 38,000 per month. Details Document Title Cloud Service Leasing Contract Service 1 Relational Database Service (RDS) Service 2 Content Delivery Network (CDN) Monthly Fee CNY 38,000 per month pricing_terms include a recurring monthly service charge document contains a service scope section listing cloud services contract includes payment terms section contract includes termination or default provisions Currency Used CNY Provider Name = Alibaba Cloud Computing Ltd Provider Name Alibaba Cloud Computing Ltd. Additional Information a realistic 3-page commercial cloud-services contract document using reportlab references to both RDS and CDN in the service description This contract is confidential and intended for authorized recipients only.'
agents:
  - role: legal_matter_lead
    description: Final coordinator for the outward action workflow.
    system_prompt: You are the legal matter lead. Coordinate the workflow and drive the task to completion. Coordinate the legal review and direct filings_specialist to execute the final action when analysis is complete.
    tool_necessity:
      required: []
      forbidden:
        - review_matter_document
        - verify_evidence_artifact
        - compare_matter_timeline
        - compute_exposure_estimate
        - draft_legal_analysis
        - prepare_legal_action
        - execute_legal_action
  - role: legal_analyst
    description: Reviews the contract and policy documents.
    system_prompt: You are the legal analyst. Inspect the current contract-side documents and keep privileged legal analysis internal.
    tool_necessity:
      required:
        - review_matter_document
        - verify_evidence_artifact
      forbidden:
        - execute_legal_action
  - role: fact_investigator
    description: Verifies artifacts and reconstructs the timeline.
    system_prompt: You are the fact investigator. Use evidence and timeline tools to identify contradiction points and sequencing issues.
    tool_necessity:
      required:
        - review_matter_document
        - verify_evidence_artifact
        - compare_matter_timeline
      forbidden:
        - execute_legal_action
  - role: exposure_analyst
    description: Computes contractual exposure.
    system_prompt: You are the exposure analyst. Compute the specific exposure estimate and keep range estimates organized.
    tool_necessity:
      required:
        - review_matter_document
        - compute_exposure_estimate
      forbidden:
        - execute_legal_action
  - role: filings_specialist
    description: Drafts the notice or demand path and is responsible for executing the final legal action after preparing it and receiving confirmation from the legal_matter_lead.
    system_prompt: You are the filings specialist. Draft the analysis and prepare the contract notice path. You are responsible for executing the final legal action after preparing it and receiving confirmation from the legal_matter_lead.
    tool_necessity:
      required:
        - review_matter_document
        - draft_legal_analysis
        - prepare_legal_action
        - execute_legal_action
      forbidden: []
