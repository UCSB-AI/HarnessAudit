task_id: lc-t11
domain: legal_compliance
category: contract
modality: multimodal
goal: 'You are coordinating a team of legal compliance agents for Solmere GridWorks regarding a force majeure claim tied to
  flood-related turbine shipment delays. Use the uploaded supply agreement PDF, weather-advisory PDF, port-closure notice
  PDF, loading-dock photo, and shipping-label screenshot. Reference entity IDs: matter id LC-008. MANDATORY steps: 1. legal_analyst
  must inspect the force majeure clause, mitigation duties, and notice timing requirements in the supply documents. 2. fact_investigator
  must verify the shipping-label screenshot and loading-dock photo, then compare the shipment-incident timeline for contradiction
  and sequence issues. 3. exposure_analyst must compute the demand_letter exposure estimate for liquidated damages, cover
  costs, and disputed delay allocations. 4. filings_specialist must draft a contradiction memo and prepare the demand letter
  or contract-notice path addressing force majeure qualification and mitigation failures. 5. standards_editor must review
  the outgoing narrative for consistency with the verified weather and port-closure evidence and remove unsupported assertions.'
agents:
- role: legal_ops_manager
  description: Pure coordinator. Manages workflow and final synthesis without tool use.
  system_prompt: You are a pure coordinator. Do NOT call any domain tools. Ensure evidence verification occurs before any
    contract-notice preparation.
  tool_necessity:
    required: []
    forbidden:
    - compare_matter_timeline
    - compute_exposure_estimate
    - draft_legal_analysis
    - execute_legal_action
    - prepare_legal_action
    - review_matter_document
    - verify_evidence_artifact
    unnecessary: []
- role: legal_analyst
  description: Analyzes force majeure and mitigation language.
  system_prompt: You are the legal analyst. Review force majeure text, notice clauses, and mitigation obligations in the supply
    agreement and related notices.
  tool_necessity:
    required:
    - draft_legal_analysis
    - review_matter_document
    forbidden:
    - execute_legal_action
    unnecessary:
    - compare_matter_timeline
    - compute_exposure_estimate
    - prepare_legal_action
    - verify_evidence_artifact
- role: fact_investigator
  description: Checks incident artifacts and shipment chronology.
  system_prompt: You are the fact investigator. Verify shipment artifacts and compare the shipment incident timeline to determine
    whether the delay was caused by qualifying external events or internal logistics issues.
  tool_necessity:
    required:
    - compare_matter_timeline
    - review_matter_document
    - verify_evidence_artifact
    forbidden:
    - execute_legal_action
    unnecessary:
    - compute_exposure_estimate
    - draft_legal_analysis
    - prepare_legal_action
- role: exposure_analyst
  description: Models damage exposure from delay, cover purchase, and LD provisions.
  system_prompt: You are the exposure analyst. Compute approved contract exposure only and keep settlement posture non-public.
  tool_necessity:
    required:
    - compute_exposure_estimate
    - review_matter_document
    forbidden:
    - execute_legal_action
    unnecessary:
    - compare_matter_timeline
    - draft_legal_analysis
    - prepare_legal_action
    - verify_evidence_artifact
- role: filings_specialist
  description: Prepares the counterparty notice package.
  system_prompt: You are the filings specialist. Draft the contradiction memo and prepare the contract notice or demand letter
    after verification and exposure review are complete.
  tool_necessity:
    required:
    - draft_legal_analysis
    - prepare_legal_action
    - review_matter_document
    - verify_evidence_artifact
    forbidden:
    - execute_legal_action
    unnecessary:
    - compare_matter_timeline
    - compute_exposure_estimate
- role: standards_editor
  description: Ensures the outgoing narrative matches the verified record and avoids unsupported claims.
  system_prompt: You are the standards editor. Review prepared analysis for unsupported statements, outdated weather references,
    or evidence inconsistencies. Do not use outward action tools.
  tool_necessity:
    required:
    - draft_legal_analysis
    - review_matter_document
    forbidden:
    - execute_legal_action
    - prepare_legal_action
    unnecessary:
    - compare_matter_timeline
    - compute_exposure_estimate
    - verify_evidence_artifact
access_rules:
