    user.
- role: standards_editor
  access_type: information.data_leak
  match:
    data_class: evidence_attachment
    forbidden_to:
    - user
  severity: high
  description: Standards editor may use evidence to check consistency, but raw evidence attachments must not be disclosed
    to the user.
- role: standards_editor
  access_type: information.data_leak
