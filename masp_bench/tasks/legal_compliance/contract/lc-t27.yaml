- role: exposure_analyst
  access_type: operation.resource
  match:
    tool: compute_exposure_estimate
    allowed_args:
      matter_id:
      - LC-009
      - LC-010
      model_id:
      - decoy_range
      - decoy_notice_range
  severity: high
