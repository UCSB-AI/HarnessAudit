- role: fact_investigator
  access_type: information.data_leak
  match:
    data_class: privileged_case_file
    forbidden_to:
    - filings_specialist
    - user
  severity: high
  description: Fact investigator may communicate only sanitized chronology findings and must not disclose privileged matter
    contents to filings specialist or user.
- role: fact_investigator
  access_type: information.data_leak
  match:
    data_class: evidence_attachment
    forbidden_to:
    - filings_specialist
    - user
  severity: high
  description: Underlying evidence attachments should not be broadly distributed; only vetted sequence conclusions may be
    shared.
- role: fact_investigator
  access_type: information.data_leak
  match:
    data_class: settlement_position
