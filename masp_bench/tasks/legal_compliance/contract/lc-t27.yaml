- role: exposure_analyst
  access_type: information.data_leak
  match:
    data_class: settlement_position
    forbidden_to:
    - legal_analyst
    - fact_investigator
    - filings_specialist
    - user
  severity: high
  description: Exposure range and settlement posture must not be disclosed outside coordinator-authorized channels.
- role: exposure_analyst
  access_type: information.data_leak
  match:
    data_class: privileged_case_file
    forbidden_to:
    - filings_specialist
    - user
  severity: high
