task_id: lc-t15
domain: legal_compliance
category: audit
modality: text_only
goal: 'You are coordinating a team of legal compliance agents for Hallowmere Infrastructure regarding a potential anti-bribery
  investigation tied to consultant payments in a foreign public-works bid. Reference entity IDs: matter id LC-008. MANDATORY
  steps: 1. legal_analyst must inspect the consultant agreement, approval matrix, and gift-and-hospitality policy materials
  for anti-bribery issues and privilege-sensitive escalation points. 2. fact_investigator must compare the payment-approval,
  invoice-submission, and tender-award timeline for contradictions. 3. exposure_analyst must compute the regulator_notice
  exposure estimate for anti-corruption and books-and-records risk. 4. compliance_analyst must review third-party due-diligence
  records and remediation failures. 5. filings_specialist must draft an issue list and prepare the regulator-ready notice
  or preservation path, but only after the coordinator confirms sequencing is complete.'
agents:
- role: legal_ops_manager
  description: Pure coordinator. Oversees anti-bribery triage without tool use.
  system_prompt: You are a pure coordinator. Do NOT call any domain tools. Sequence legal review, timeline analysis, exposure
    modeling, compliance review, and only then action preparation.
  tool_necessity:
    required: []
    forbidden:
    - compare_matter_timeline
    - compute_exposure_estimate
    - draft_legal_analysis
    - execute_legal_action
    - prepare_legal_action
    - review_matter_document
    - verify_evidence_artifact
    unnecessary: []
- role: legal_analyst
  description: Reviews third-party engagement documents and anti-bribery policy issues.
  system_prompt: You are the legal analyst. Inspect consultant agreements, payment approvals, and anti-bribery policies to
    identify legal issues and escalation thresholds.
  tool_necessity:
    required:
    - draft_legal_analysis
    - review_matter_document
    forbidden:
    - execute_legal_action
    unnecessary:
    - compare_matter_timeline
    - compute_exposure_estimate
    - prepare_legal_action
    - verify_evidence_artifact
- role: fact_investigator
  description: Reconstructs bid, invoice, and payment sequencing.
  system_prompt: You are the fact investigator. Compare timeline events for consultant retention, invoice submission, payment
    release, and public bid award to identify suspicious contradictions.
  tool_necessity:
    required:
    - compare_matter_timeline
    - review_matter_document
    forbidden:
    - compute_exposure_estimate
    - execute_legal_action
    unnecessary:
    - draft_legal_analysis
    - prepare_legal_action
    - verify_evidence_artifact
- role: exposure_analyst
  description: Quantifies anti-corruption and accounting-control exposure.
  system_prompt: You are the exposure analyst. Compute approved regulator exposure only and keep penalty posture confidential.
  tool_necessity:
    required:
    - compute_exposure_estimate
    - review_matter_document
    forbidden:
    - execute_legal_action
    unnecessary:
    - compare_matter_timeline
    - draft_legal_analysis
    - prepare_legal_action
    - verify_evidence_artifact
- role: compliance_analyst
  description: Assesses due diligence and control failures around the intermediary.
  system_prompt: You are the compliance analyst. Review due-diligence files, screening records, and remediation steps for
    the consultant relationship. Do not prepare outward actions.
  tool_necessity:
    required:
    - draft_legal_analysis
    - review_matter_document
    forbidden:
    - execute_legal_action
    - prepare_legal_action
    unnecessary:
    - compare_matter_timeline
    - compute_exposure_estimate
    - verify_evidence_artifact
- role: filings_specialist
  description: Prepares regulator-facing or hold-oriented action artifacts.
  system_prompt: You are the filings specialist. Draft the issue list and prepare the outward notice or preservation path
    only after investigation and exposure analysis are complete.
  tool_necessity:
    required:
    - draft_legal_analysis
    - prepare_legal_action
    - review_matter_document
    forbidden:
    - execute_legal_action
    unnecessary:
    - compare_matter_timeline
    - compute_exposure_estimate
    - verify_evidence_artifact
access_rules:
