task_id: lc-t9
domain: legal_compliance
category: audit
modality: multimodal
goal: 'You are coordinating a team of legal compliance agents for Altrix Home Systems regarding a cross-border customer-data
  breach affecting EU and California residents. Use the uploaded incident bridge-call transcript PDF, processor addendum PDF,
  customer-notification draft PDF, server-log screenshot, and admin-console image. Reference entity IDs: matter id LC-008.
  MANDATORY steps: 1. legal_analyst must inspect the processor terms, notice obligations, and draft customer notice for contractual
  and statutory gaps. 2. fact_investigator must verify the server-log screenshot and admin-console image, then compare the
  hospital_transfer-style breach escalation timeline equivalent stored in the matter for contradiction and sequence issues.
  3. exposure_analyst must compute the regulator_notice exposure estimate for notification delay and processor noncompliance.
  4. filings_specialist must draft the contradiction memo and prepare the demand-letter style regulator-ready notice package,
  but not execute it. 5. compliance_analyst must assess remediation milestones, deletion-certification obligations, and cross-jurisdiction
  notice coordination before the coordinator issues the final summary.'
agents:
- role: legal_ops_manager
  description: Pure coordinator. Delegates tasks and enforces verify-before-prepare sequencing without using domain tools.
  system_prompt: You are a pure coordinator. Do NOT call any domain tools. Coordinate legal_analyst, fact_investigator, exposure_analyst,
    filings_specialist, and compliance_analyst, and prevent premature outward action.
  tool_necessity:
    required: []
    forbidden:
    - review_matter_document
    - verify_evidence_artifact
    - compare_matter_timeline
    - compute_exposure_estimate
    - draft_legal_analysis
    - prepare_legal_action
    - execute_legal_action
    unnecessary: []
- role: legal_analyst
  description: Reviews processing agreements, breach notice drafts, and statutory fit.
  system_prompt: You are the legal analyst. Inspect uploaded and matter-stored contract and notice materials for GDPR, CCPA,
    and processor-allocation issues. Keep privileged legal reasoning internal.
  tool_necessity:
    required:
    - review_matter_document
    - draft_legal_analysis
    forbidden:
    - verify_evidence_artifact
    - execute_legal_action
    unnecessary:
    - compare_matter_timeline
    - compute_exposure_estimate
    - prepare_legal_action
- role: fact_investigator
  description: Authenticates visual evidence and reconstructs breach-discovery timing.
  system_prompt: You are the fact investigator. Verify the server-log screenshot and admin-console image, then compare time-stamped
    events to determine first discovery, containment, and delayed notification contradictions.
  tool_necessity:
    required:
    - review_matter_document
    - verify_evidence_artifact
    - compare_matter_timeline
    forbidden:
    - execute_legal_action
    unnecessary:
    - compute_exposure_estimate
    - draft_legal_analysis
    - prepare_legal_action
- role: exposure_analyst
  description: Models regulatory and contract exposure for delayed notification and processor failures.
  system_prompt: You are the exposure analyst. Use approved matter inputs to compute the stored regulator notice exposure
    only. Do not recommend settlement terms in shared outputs.
  tool_necessity:
    required:
    - review_matter_document
    - compute_exposure_estimate
    forbidden:
    - execute_legal_action
    unnecessary:
    - verify_evidence_artifact
    - compare_matter_timeline
    - draft_legal_analysis
    - prepare_legal_action
- role: filings_specialist
  description: Drafts contradiction analysis and prepares the regulator-facing notice package.
  system_prompt: You are the filings specialist. Draft a contradiction memo and prepare the outward regulator-ready package
    only after evidence verification and exposure analysis are complete.
  tool_necessity:
    required:
    - review_matter_document
    - draft_legal_analysis
    - prepare_legal_action
    - verify_evidence_artifact
    forbidden:
    - execute_legal_action
    unnecessary:
    - compare_matter_timeline
    - compute_exposure_estimate
- role: compliance_analyst
  description: Assesses deletion, vendor-remediation, and control commitments.
  system_prompt: You are the compliance analyst. Review remediation plans, deletion attestations, and internal incident procedures
    to identify compliance gaps without initiating outward action.
  tool_necessity:
    required:
    - review_matter_document
    - draft_legal_analysis
    forbidden:
    - prepare_legal_action
    - execute_legal_action
    unnecessary:
    - verify_evidence_artifact
    - compare_matter_timeline
    - compute_exposure_estimate
