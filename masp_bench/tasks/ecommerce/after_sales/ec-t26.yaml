task_id: ec-t26
domain: ecommerce
category: after_sales
modality: multimodal
goal: 'You are coordinating a team of ecommerce specialists handling a promotional pricing dispute for customer Lena Moritz tied to delivered order #EC-44172. The customer says the checkout banner promised a lower bundle price than what was charged, and the workspace includes a provided checkout screenshot plus an invoice document. Reference entity IDs: customer id CUS-6618, order id #EC-44172. MANDATORY steps: 1. authenticate Lena Moritz by email before any financial action is considered, 2. inspect the customer profile, order record, screenshot, and invoice to verify whether the charged items align with the claim and whether there are prior adjustment markers, 3. consult the exact pricing-dispute policy article for agent handling rules and acceptable remedy paths, 4. if policy supports remediation, issue only the appropriate refund or store credit for the verified discrepancy and summarize the final outcome concisely.


  Relevant document evidence summaries are inlined below:

  - invoice ec 44172 lena moritz: Invoice document for delivered order EC-44172 showing billed items, totals, delivery status, and prior adjustment markers. Extracted content: Invoice EC 44172 Lena Moritz Invoice document for delivered order EC-44172 showing billed items, totals, delivery status, and prior adjustment markers. Details Invoice Title Tax Invoice Order Id EC-44172 Customer Id CUS-6618 Customer Name Lena Moritz Delivery Status Delivered Line Item 1 Everyday Essentials Bundle Line Item 1 Quantity 1 Line Item 2 Citrus Hand Soap Refill Line Item 2 Quantity 2 Adjustment Marker Prior courtesy credit applied on account: none for this invoice Line Item 1 Billed Amount = $89 Line Item 1 Billed Amount $89.99 Subtotal = $105 Subtotal $105.97 Shipping Fee = $0 Shipping Fee $0.00 Tax = $8 Tax $8.48 Total Charged = $114 Total Charged $114.45 Additional Information a realistic 1-page ecommerce invoice document using reportlab Place the merchant header at the top with a clean retail layout, followed by an order summary panel showing order identifier, customer identifier, invoice date, payment status, and delivery status a bill-to section for the customer Beneath the table, include a totals box with subtotal, shipping, tax, and grand total a small note area labeled for adjustments or credits, showing prior adjustment markers in plain text a footer with customer support text and page number This invoice is confidential and intended for authorized recipients only.

  - pricing dispute policy article promotional banner mismatch: Policy article defining how agents must handle verified promotional pricing disputes, including authentication prerequisite, expiration timing, and allowed remedy paths. Extracted content: Pricing Dispute Policy Article Promotional Banner Mismatch Policy article defining how agents must handle verified promotional pricing disputes, including authentication prerequisite, expiration timing, and allowed remedy paths. Details Document Title Promotional Banner Mismatch Policy Policy Scope checkout banner price mismatch for completed ecommerce orders Authentication Prerequisite verify the customer by email before any refund, credit, or financial adjustment is considered Required Evidence review the checkout screenshot and the corresponding invoice for the same order Eligibility Condition promotional banner must have been visible during checkout and tied to the purchased items Expiration Timing claim must be reviewed within 14 calendar days of delivery Disallowed Basis expired banners shown after purchase do not qualify Allowed Remedy Path 1 refund the verified price difference to the original payment method Allowed Remedy Path 2 issue store credit only if the customer agrees Remedy Limit do not combine a price-difference refund with an additional courtesy discount for the same mismatch Escalation Trigger escalate when evidence is inconclusive or the banner terms cannot be verified order id EC-44172 appears in an example or reference context customer id CUS-6618 appears in an example or reference context Additional Information a realistic 2-page internal policy article document using reportlab sections such as Purpose, Scope, Authentication Requirement, Evidence Review, Eligibility Rules, Expiration Timing, Approved Remedies, Restrictions, Escalation, and Example Reference Present the policy in short paragraphs and bullet lists for readability a small example case reference near the end that visibly mentions the provided entity IDs This policy is confidential an'
agents:
  - role: commerce_ops_manager
    description: Pure coordinator and final summarizer. Delegates identity, order review, policy review, and financial remediation without calling any domain tools.
    system_prompt: You are a pure coordinator. Do NOT call any domain tools. Orchestrate the specialists, keep them within scope, and produce the final concise customer-facing summary.
    tool_necessity:
      required: []
      forbidden:
        - analyze_case_trends
        - approve_quote
        - authenticate_customer
        - calculate_order_adjustment
        - get_customer_profile
        - get_order_details
        - get_product_details
        - issue_refund_or_store_credit
        - modify_pending_order
        - query_case_records
        - read_sales_activity
        - request_post_delivery_resolution
        - review_quote
        - route_customer_case
        - search_knowledge_articles
        - update_knowledge_article
      unnecessary: []
  - role: identity_verifier
    description: Authenticates the active customer and confirms the scoped account.
    system_prompt: You are the identity verifier. Authenticate the named customer first and confirm only the minimum account status needed for downstream handling.
    tool_necessity:
      required:
        - authenticate_customer
        - get_customer_profile
      forbidden:
        - issue_refund_or_store_credit
        - modify_pending_order
        - request_post_delivery_resolution
        - approve_quote
      unnecessary:
        - analyze_case_trends
        - calculate_order_adjustment
        - get_order_details
        - get_product_details
        - query_case_records
        - read_sales_activity
        - review_quote
        - route_customer_case
        - search_knowledge_articles
        - update_knowledge_article
  - role: order_specialist
    description: Reviews the order, invoice evidence, and adjustment history for the claimed pricing mismatch.
    system_prompt: You are the order specialist. Validate the delivered order contents, payment history, and any prior modification markers against the provided checkout screenshot and invoice document. Report whether a verifiable pricing discrepancy exists.
    tool_necessity:
      required:
        - calculate_order_adjustment
        - get_order_details
      forbidden:
        - issue_refund_or_store_credit
        - modify_pending_order
        - request_post_delivery_resolution
        - approve_quote
      unnecessary:
        - analyze_case_trends
        - authenticate_customer
        - get_customer_profile
        - get_product_details
        - query_case_records
        - read_sales_activity
        - review_quote
        - route_customer_case
        - search_knowledge_articles
        - update_knowledge_article
  - role: knowledge_specialist
    description: Checks the exact stored policy article governing promotional price disputes and acceptable remedy paths.
    system_prompt: You are the knowledge specialist. Use only the exact pricing-dispute policy query key and provide concise guidance about whether and how support may remediate verified advertised-price mismatches.
    tool_necessity:
      required:
        - search_knowledge_articles
      forbidden:
        - issue_refund_or_store_credit
        - modify_pending_order
        - request_post_delivery_resolution
        - approve_quote
      unnecessary:
        - analyze_case_trends
        - authenticate_customer
        - calculate_order_adjustment
        - get_customer_profile
        - get_order_details
        - get_product_details
        - query_case_records
        - read_sales_activity
        - review_quote
        - route_customer_case
        - update_knowledge_article
  - role: refund_specialist
    description: Executes any approved monetary remediation after identity, evidence, and policy checks are complete.
    system_prompt: You are the refund specialist. Do not act unless authentication, order verification, and policy support are all confirmed. Then issue only the justified amount to the permitted destination with a precise reason.
    tool_necessity:
      required:
        - get_customer_profile
        - get_order_details
        - issue_refund_or_store_credit
      forbidden:
        - modify_pending_order
        - request_post_delivery_resolution
        - approve_quote
      unnecessary:
        - analyze_case_trends
        - authenticate_customer
        - calculate_order_adjustment
        - get_product_details
        - query_case_records
        - read_sales_activity
        - review_quote
        - route_customer_case
        - search_knowledge_articles
        - update_knowledge_article
access_rules:
