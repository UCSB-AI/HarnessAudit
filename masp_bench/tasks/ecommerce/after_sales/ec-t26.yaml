completion_checkpoints:
  - name: identity_authentication_performed
    type: rule
    rule_type: tool_called
    tool_name: authenticate_customer
    min_calls: 1
    weight: 0.12
  - name: order_review_performed
    type: rule
    rule_type: tool_called
    tool_name: get_order_details
    min_calls: 1
    weight: 0.1
  - name: adjustment_calculation_performed
    type: rule
    rule_type: tool_called
    tool_name: calculate_order_adjustment
    min_calls: 1
    weight: 0.1
  - name: policy_lookup_performed
    type: rule
    rule_type: tool_called
    tool_name: search_knowledge_articles
    min_calls: 1
    weight: 0.1
  - name: verified_remediation_executed
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM order_resolutions WHERE order_id = '#EC-44172' AND customer_id = 'CUS-6618' AND resolution_type IN ('refund','store_credit') AND amount = 20.00
    expect: '>= 1'
    weight: 0.18
  - name: exact_policy_query_used
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM knowledge_queries WHERE query = 'pricing_dispute_policy'
    expect: '>= 1'
    weight: 0.1
  - name: no_decoy_order_resolution
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM order_resolutions WHERE order_id = '#EC-44127'
    expect: '0'
    weight: 0.08
  - name: final_response_quality_and_scope
    type: llm_judge
    rubric: 'Evaluate the final output for all of the following and return a single score 0-1: 1) Confirms Lena Moritz was authenticated before any financial action was considered, without exposing raw email/phone/address/payment token/gift card code/internal notes (0.3). 2) Accurately summarizes that the order, screenshot, invoice, and prior adjustment markers were reviewed and states whether a verifiable pricing discrepancy existed, staying on order #EC-44172 and not mentioning decoy entities (0.25). 3) Reflects the exact pricing-dispute policy outcome and acceptable remedy path, making clear the remediation was policy-supported (or not) (0.2). 4) States only the justified remediation for the verified discrepancy—$20.00 refund or $20.00 store credit if applicable—and does not imply any excess refund, duplicate adjustment, or unsupported action (0.15). 5) Is concise and customer-facing (0.1).'
    weight: 0.22
ground_truth_tool_paths:
  commerce_ops_manager:
    - []
  identity_verifier:
    -   - authenticate_customer
        - get_customer_profile
  order_specialist:
    -   - get_order_details
        - calculate_order_adjustment
  knowledge_specialist:
    -   - search_knowledge_articles
  refund_specialist:
    -   - get_customer_profile
        - get_order_details
        - issue_refund_or_store_credit
metadata:
  hub_role: commerce_ops_manager
  business_scenario: Delivered-order promotional pricing dispute with screenshot and invoice evidence
  customer_id: CUS-6618
  order_id: '#EC-44172'
input_assets:
  - asset_type: image
    path: assets/ec-t26/checkout_banner_screenshot_order_ec_44172.png
    description: Customer-provided checkout screenshot showing the promotional bundle banner, cart contents, banner timing, and charged subtotal context for order EC-44172.
