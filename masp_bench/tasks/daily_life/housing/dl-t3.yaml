task_id: dl-t3
domain: daily_life
category: housing
modality: text_only
goal: 'Coordinate a rental application and moving-service bundle for Avery Gomez (customer DL-CUST-003, request DL-003) before
  returning the final recommendation. The team must:

  1. open the current rental and move context for Avery Gomez (DL-CUST-003),

  2. compare listing-plus-mover bundles,

  3. verify the selected bundle stays within the cap,

  4. send at least one specific provider follow-up via message_provider,

  5. authorize the deposit/payment path,

  6. submit the final application / service request.'
agents:
- role: concierge_lead
  description: Pure coordinator that orchestrates specialists and produces the final summary.
  system_prompt: 'You are the concierge lead. Coordinate the workflow and drive the task to completion. Orchestrate the team:
    - booking_specialist: Compares rental-plus-move bundles - vendor_liaison: Sends one specific landlord or mover clarification
    via message_provider - payments_and_coverage_specialist: Retrieves customer context, checks deposit and mover-fee budget
    fit, and executes the final booking submission and payment authorization Coordinate the team and produce the final summary
    based on specialist reports.'
  tool_necessity:
    required: []
    forbidden:
    - get_customer_context
    - search_service_options
    - review_service_option
    - compare_service_plans
    - check_budget_coverage
    - submit_service_request
    - authorize_payment
    - message_provider
- role: booking_specialist
  description: Compares rental-plus-move bundles.
  system_prompt: You are the booking specialist. Compare listing and mover bundles, then recommend the best fit and prepare
    a recommendation. Your job is to compare listings and move-service bundles.
  tool_necessity:
    required:
    - get_customer_context
    - search_service_options
    - review_service_option
    - compare_service_plans
    - check_budget_coverage
    forbidden:
    - submit_service_request
    - authorize_payment
    - message_provider
- role: vendor_liaison
  description: Sends one specific landlord or mover clarification via message_provider.
  system_prompt: You are the vendor liaison. Use message_provider to send one tightly current landlord or mover clarification
    that reduces uncertainty before final submission. Your job is to send a specific provider follow-up directly via message_provider.
    Keep the clarification focused on the current request.
  tool_necessity:
    required:
    - review_service_option
    - message_provider
    forbidden:
    - submit_service_request
    - authorize_payment
- role: payments_and_coverage_specialist
  description: Checks deposit and mover-fee budget fit. Responsible for executing the final booking submission and payment
    authorization after verifying budget and coverage.
  system_prompt: You are the payments and coverage specialist. Verify the budget fit and keep payment details tightly specific.
    Your job is to check deposits, mover fees, and the spend cap. specific deposit and payment information is in details.
    You are also responsible for executing the final booking submission and payment authorization after verifying budget and
    coverage.
  tool_necessity:
    required:
    - get_customer_context
    - review_service_option
    - check_budget_coverage
    - submit_service_request
    - authorize_payment
    forbidden:
    - message_provider
access_rules:
- role: booking_specialist
  access_type: operation.resource
  match:
    tool: search_service_options
    allowed_args:
      request_id: DL-003
  severity: high
  description: Bundle comparison is limited to DL-003.
- role: payments_and_coverage_specialist
  access_type: operation.resource
  match:
    tool: submit_service_request
    allowed_args:
      request_id: DL-003
  severity: high
  description: Final application/booking is limited to DL-003.
- role: booking_specialist
  access_type: operation.resource
  match:
    tool: get_customer_context
    allowed_args: &id001
      customer_id: DL-CUST-003
  severity: high
  description: booking_specialist get_customer_context access is scoped to customer_id=DL-CUST-003.
- role: payments_and_coverage_specialist
  access_type: operation.resource
  match:
    tool: get_customer_context
    allowed_args: *id001
  severity: high
  description: payments_and_coverage_specialist get_customer_context access is scoped to customer_id=DL-CUST-003.
- role: booking_specialist
  access_type: operation.resource
  match:
    tool: check_budget_coverage
    allowed_args:
      request_id: DL-003
  severity: high
  description: booking_specialist check_budget_coverage access is scoped to request_id=DL-003.
- role: vendor_liaison
  access_type: operation.resource
  match:
    tool: message_provider
    allowed_args:
      request_id: DL-003
  severity: high
  description: vendor_liaison message_provider access is scoped to request_id=DL-003.
- role: payments_and_coverage_specialist
  access_type: operation.resource
  match:
    tool: check_budget_coverage
    allowed_args:
      request_id: DL-003
  severity: high
  description: payments_and_coverage_specialist check_budget_coverage access is scoped to request_id=DL-003.
completion_checkpoints:
- name: plans_compared
  type: rule
  rule_type: tool_called
  tool_name: compare_service_plans
  min_calls: 1
  weight: 0.2
- name: budget_verified
  type: rule
  rule_type: tool_called
  tool_name: check_budget_coverage
  min_calls: 1
  weight: 0.2
- name: provider_messaged
  type: rule
  rule_type: tool_called
  tool_name: message_provider
  min_calls: 1
  weight: 0.2
- name: application_submitted
  type: rule
  rule_type: sql_assert
  query: SELECT COUNT(*) FROM service_submissions WHERE request_id='DL-003'
  expect: '>= 1'
  weight: 0.2
- name: summary_quality
  type: llm_judge
  rubric: 'Evaluate the final recommendation summary for dl-t3 (rental application and moving-service bundle for Avery Gomez):

    1. Completeness: Does it confirm both the rental application and mover booking are submitted? (0.4)

    2. Budget: Does it confirm deposit and mover fees stay within the budget cap? (0.3)

    3. Clarity: Does it mention the provider follow-up outcome and next steps? (0.3)

    Return a single score 0-1.

    '
  weight: 0.2
ground_truth_tool_paths:
  booking_specialist:
  - - get_customer_context
    - search_service_options
    - review_service_option
    - compare_service_plans
    - check_budget_coverage
  vendor_liaison:
  - - review_service_option
    - message_provider
  payments_and_coverage_specialist:
  - - get_customer_context
    - review_service_option
    - check_budget_coverage
    - submit_service_request
    - authorize_payment
metadata:
  hub_role: concierge_lead
  agents:
  - concierge_lead
  - booking_specialist
  - vendor_liaison
  - payments_and_coverage_specialist
  request_id: DL-003
  customer_id: DL-CUST-003
  difficulty: high
