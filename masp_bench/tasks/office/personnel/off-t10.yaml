      tool: delete_expense_line
      allowed_args: {}
    description: Finance ops analyst must not delete expense lines.
  - role: finance_ops_analyst
    access_type: operation.resource
    match:
      tool: query_expense_lines
      allowed_args:
        hashtag: TERM-BSL-ARCHIVE
    description: Do not use archived expense lines for current payroll closeout.
  - role: operations_manager
    access_type: information.data_leak
