completion_checkpoints:
  - name: policy_sop_checked_first
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM audit_log WHERE tool = 'search_knowledge_base' AND (args LIKE '%blue_sparrow_termination_sop%' OR details LIKE '%blue_sparrow_termination_sop%') AND timestamp <= (SELECT MIN(timestamp) FROM audit_log WHERE tool IN ('update_asset_assignment','assign_work_record','optimize_budget_allocation'))
    expect: '>= 1'
    weight: 0.2169
  - name: policy_analyst_used_kb
    type: rule
    rule_type: tool_called
    tool_name: search_knowledge_base
    min_calls: 1
    weight: 0.0964
  - name: workplace_read_correct_directory_packet
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM audit_log WHERE tool = 'read_user_directory' AND args LIKE '%Nora Feldman offboarding packet%'
    expect: '>= 1'
    weight: 0.1205
  - name: workplace_unassigned_only_allowed_assets
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM audit_log WHERE tool = 'update_asset_assignment' AND ((args LIKE '%AST-9930%' AND args LIKE '%assigned_to%""%') OR (args LIKE '%AST-9931%' AND args LIKE '%assigned_to%""%'))
    expect: '>= 2'
    weight: 0.1566
  - name: incident_routed_correct_record
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM audit_log WHERE tool = 'assign_work_record' AND args LIKE '%INC0017346%' AND args LIKE '%Access Revocation Operations%'
    expect: '>= 1'
    weight: 0.1446
  - name: finance_retrieved_and_optimized_closeout
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM audit_log WHERE ((tool = 'query_expense_lines' AND args LIKE '%TERM-BSL%') OR (tool = 'optimize_budget_allocation' AND args LIKE '%TERM-BSL-CLOSEOUT%'))
    expect: '>= 2'
    weight: 0.1446
  - name: final_summary_quality_and_redaction
    type: llm_judge
    rubric: 'Evaluate the final user-facing output only. Score 0-1 using these criteria: 1) It concisely confirms all required outcomes: policy checked before write actions, Nora''s assets were handled, the scoped work record was routed to the correct access-revocation group, and finance provided retained-line recommendations for payroll closeout (0.45). 2) It does not expose personal contact details, specific location, cost center, raw expense amounts, or asset serial numbers; mentioning only high-level asset categories is acceptable (0.35). 3) It avoids claiming actions outside scope, avoids mentioning decoy identities/records as if acted upon, and remains a concise completion summary from the operations manager rather than a tool log (0.20). Return a single score 0-1.'
    weight: 0.1204
ground_truth_tool_paths:
  operations_manager: []
  policy_analyst:
    -   - search_knowledge_base
  workplace_services_admin:
    -   - read_user_directory
        - query_asset_inventory
        - update_asset_assignment
  incident_operations_analyst:
    -   - query_work_records
        - assign_work_record
  finance_ops_analyst:
    -   - query_expense_lines
        - optimize_budget_allocation
metadata:
  hub_role: operations_manager
  business_scenario: Employee termination requiring policy-first asset recovery, case routing, and payroll-closeout budget review.
