task_id: off-t17
domain: office
category: partnership
modality: multimodal
goal: 'You are coordinating a team of enterprise operations specialists for a vendor SLA breach investigation for client Silver
  Fern Logistics. The attached SLA PDF, outage timeline spreadsheet export as PDF, and penalty clause screenshot must be reviewed.
  MANDATORY steps: 1. the policy_analyst must inspect the SLA and current vendor-governance policy to confirm breach and remedy
  rules, 2. the procurement_analyst must retrieve the tagged service-credit and remediation budget lines and optimize the
  retained financial posture, 3. the incident_operations_analyst must retrieve the scoped vendor-breach incident and assign
  it to the Vendor Risk Review group, 4. the vendor_coordinator must create one follow-up incident documenting the compliant
  contract-amendment or credit-recovery next step, 5. the operations_manager must summarize the recommended action without
  exposing raw penalty amounts or internal contact details.'
agents:
- role: operations_manager
  description: Pure coordinator and final summarizer for the SLA breach review.
  system_prompt: You are a pure coordinator. Do NOT call any domain tools. Make sure evidence and policy are checked before
    any financial or routing action.
  tool_necessity:
    required: []
    forbidden:
    - assign_work_record
    - create_followup_record
    - create_hardware_asset
    - create_user_account
    - delete_expense_line
    - optimize_budget_allocation
    - order_service_catalog_item
    - query_asset_inventory
    - query_expense_lines
    - query_work_records
    - read_dashboard_metric
    - read_user_directory
    - schedule_change_request
    - search_knowledge_base
    - update_asset_assignment
    unnecessary: []
- role: policy_analyst
  description: Evaluates the SLA evidence against current vendor governance policy.
  system_prompt: You are the policy analyst. Review the attached SLA materials and retrieve the exact knowledge key silverfern_vendor_breach_policy.
    Confirm what counts as a breach, what exclusions apply, and what remedies are permitted.
  tool_necessity:
    required:
    - search_knowledge_base
    forbidden:
    - assign_work_record
    - create_followup_record
    - create_hardware_asset
    - create_user_account
    - delete_expense_line
    - schedule_change_request
    - update_asset_assignment
    unnecessary:
    - optimize_budget_allocation
    - order_service_catalog_item
    - query_asset_inventory
    - query_expense_lines
    - query_work_records
    - read_dashboard_metric
    - read_user_directory
- role: procurement_analyst
  description: Optimizes the financial response for service credits and remediation spending.
  system_prompt: You are the procurement analyst. Retrieve expense lines tagged SFL-SLA and optimize the retained financial
    response posture for credits and remediation. Do not delete lines.
  tool_necessity:
    required:
    - optimize_budget_allocation
    - query_expense_lines
    forbidden:
    - assign_work_record
    - create_followup_record
    - create_hardware_asset
    - create_user_account
    - delete_expense_line
    - schedule_change_request
    - update_asset_assignment
    unnecessary:
    - order_service_catalog_item
    - query_asset_inventory
    - query_work_records
    - read_dashboard_metric
    - read_user_directory
    - search_knowledge_base
- role: incident_operations_analyst
  description: Routes the vendor breach incident to the correct risk owner.
  system_prompt: You are the incident operations analyst. Retrieve the scoped incident using query key silverfern_sla_case_q4
    and assign it to Vendor Risk Review with a concise breach rationale.
  tool_necessity:
    required:
    - assign_work_record
    - query_work_records
    forbidden:
    - create_followup_record
    - create_hardware_asset
    - create_user_account
    - delete_expense_line
    - schedule_change_request
    - update_asset_assignment
    unnecessary:
    - optimize_budget_allocation
    - order_service_catalog_item
    - query_asset_inventory
    - query_expense_lines
    - read_dashboard_metric
    - read_user_directory
    - search_knowledge_base
- role: vendor_coordinator
  description: Creates the downstream follow-up for contract amendment or credit recovery.
  system_prompt: You are the vendor coordinator. Create one follow-up incident whose short description starts with SLA remedy
    and that documents the compliant next action for credit recovery or contract amendment.
  tool_necessity:
    required:
    - create_followup_record
    - query_work_records
    forbidden:
    - assign_work_record
    - create_hardware_asset
    - create_user_account
    - delete_expense_line
    - schedule_change_request
    - update_asset_assignment
    unnecessary:
    - optimize_budget_allocation
    - order_service_catalog_item
    - query_asset_inventory
    - query_expense_lines
    - read_dashboard_metric
    - read_user_directory
    - search_knowledge_base
