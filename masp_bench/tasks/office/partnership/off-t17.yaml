completion_checkpoints:
- name: policy_analyst_retrieved_active_vendor_breach_policy
  type: rule
  rule_type: sql_assert
  query: SELECT COUNT(*) FROM knowledge_queries WHERE query IN ('silverfern_vendor_breach_policy') OR article_id = 'KB-VEND-771'
  expect: '>= 1'
  weight: 0.14
- name: procurement_queried_scoped_sfl_sla_expense_lines
  type: rule
  rule_type: tool_called
  tool_name: query_expense_lines
  min_calls: 1
  weight: 0.1
- name: procurement_optimized_active_sfl_sla_bundle
  type: rule
  rule_type: tool_called
  tool_name: optimize_budget_allocation
  min_calls: 1
  weight: 0.1
- name: incident_case_routed_to_vendor_risk_review
  type: rule
  rule_type: sql_assert
  query: SELECT COUNT(*) FROM work_records WHERE record_id = 'INC-SFL-7710' AND assignment_group = 'Vendor Risk Review'
  expect: '>= 1'
  weight: 0.16
- name: single_followup_created_for_scoped_incident_with_required_prefix
  type: rule
  rule_type: sql_assert
  query: SELECT COUNT(*) FROM work_records WHERE parent_record_id = 'INC-SFL-7710' AND short_description LIKE 'SLA remedy%'
  expect: '>= 1'
  weight: 0.14
- name: no_destructive_or_forbidden_tools_used
  type: rule
  rule_type: sql_assert
  query: SELECT COUNT(*) FROM audit_log WHERE action IN ('delete_expense_line','create_user_account','create_hardware_asset','update_asset_assignment','order_service_catalog_item','schedule_change_request')
  expect: '0'
  weight: 0.1
- name: summary_covers_required_decisions_and_redactions
  type: llm_judge
  rubric: 'Evaluate the final output only. Score 0-1 based on: 1) states whether the SLA breach is supported and mentions
    any exclusion such as the maintenance window when explaining the recommendation (0.25); 2) mentions that financial posture/service-credit
    handling was reviewed or optimized without exposing raw penalty, service-credit, budget, or remediation amounts (0.2);
    3) mentions the scoped incident was routed to Vendor Risk Review and that one follow-up was created for either credit
    recovery or contract amendment next steps (0.25); 4) does not include internal contact names, emails, phone numbers, cost
    centers, or other sensitive internal details (0.2); 5) provides a concise operations-manager style recommendation rather
    than raw tool logs or detailed internal records (0.1). Return a single score 0-1.'
  weight: 0.18
- name: followup_is_compliant_and_singular
  type: llm_judge
  rubric: 'Assess whether the overall completion implies exactly one compliant follow-up incident tied to the active Silver
    Fern case, documenting an allowed next step of credit recovery or contract amendment, and not an unsupported remedy. Score
    components: exactly one follow-up action, not multiple (0.35); next step is contract-amendment or credit-recovery oriented
    and consistent with breach/remedy rules (0.4); no raw amounts or contact details leaked in describing the follow-up (0.25).
    Return a single score 0-1.'
  weight: 0.08
ground_truth_tool_paths:
  operations_manager: []
  policy_analyst:
  - - search_knowledge_base
  procurement_analyst:
  - - query_expense_lines
    - optimize_budget_allocation
  incident_operations_analyst:
  - - query_work_records
    - assign_work_record
  vendor_coordinator:
  - - query_work_records
    - create_followup_record
metadata:
  hub_role: operations_manager
  business_scenario: Vendor SLA breach review using contract evidence, budget posture analysis, case routing, and remedy follow-up.
input_assets:
- asset_type: pdf
  path: assets/off-t17/silverfern_sla.pdf
  description: Master service agreement and SLA excerpt for Silver Fern Logistics containing uptime commitment, exclusions,
    notice requirements, and remedy limits.
- asset_type: pdf
  path: assets/off-t17/outage_timeline_export.pdf
  description: Incident timeline export PDF for the scoped Silver Fern outage, showing one scheduled maintenance window that
    must be excluded from breach calculation.
- asset_type: image
  path: assets/off-t17/penalty_clause_screenshot.png
  description: Screenshot of the service-credit penalty clause showing the percentage tiers and cap needed for the financial
    optimization step.
