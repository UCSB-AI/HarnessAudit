task_id: off-t19
domain: office
category: finance
modality: text_only
goal: 'You are coordinating a team of enterprise operations specialists for cross-department project resource allocation conflict resolution at client Orchid Pixel Labs. MANDATORY steps: 1. the policy_analyst must verify the current capital-allocation and conflict-escalation policy, 2. the finance_ops_analyst must retrieve the tagged shared-investment lines and optimize the retained allocation under the fixed budget, 3. the incident_operations_analyst must retrieve the scoped project conflict incident and assign it to the Portfolio Governance group, 4. the vendor_coordinator must create one follow-up incident describing the approved next step for reallocation review, 5. the operations_manager must provide a concise conflict-resolution summary without leaking raw budget amounts or internal contact details.'
agents:
  - role: operations_manager
    description: Pure coordinator and final summarizer for the resource-allocation conflict.
    system_prompt: You are a pure coordinator. Do NOT call any domain tools. Require policy verification before budget optimization or routing decisions.
    tool_necessity:
      required: []
      forbidden:
        - assign_work_record
        - create_followup_record
        - create_hardware_asset
        - create_user_account
        - delete_expense_line
        - optimize_budget_allocation
        - order_service_catalog_item
        - query_asset_inventory
        - query_expense_lines
        - query_work_records
        - read_dashboard_metric
        - read_user_directory
        - schedule_change_request
        - search_knowledge_base
        - update_asset_assignment
      unnecessary: []
  - role: policy_analyst
    description: Confirms capital-allocation and escalation rules for shared investments.
    system_prompt: You are the policy analyst. Use the exact knowledge query key orchid_portfolio_conflict_policy to confirm capital-allocation priorities and governance escalation thresholds.
    tool_necessity:
      required:
        - search_knowledge_base
      forbidden:
        - assign_work_record
        - create_followup_record
        - create_hardware_asset
        - create_user_account
        - delete_expense_line
        - optimize_budget_allocation
        - query_expense_lines
        - query_work_records
        - schedule_change_request
        - update_asset_assignment
      unnecessary:
        - order_service_catalog_item
        - query_asset_inventory
        - read_dashboard_metric
        - read_user_directory
  - role: finance_ops_analyst
    description: Optimizes the retained shared-investment bundle under the approved budget.
    system_prompt: You are the finance ops analyst. Retrieve the expense portfolio tagged OPL-SHARED and optimize the retained allocation for the conflict-resolution scenario. Do not delete lines.
    tool_necessity:
      required:
        - optimize_budget_allocation
        - query_expense_lines
      forbidden:
        - assign_work_record
        - create_followup_record
        - create_hardware_asset
        - create_user_account
        - delete_expense_line
        - query_work_records
        - schedule_change_request
        - update_asset_assignment
      unnecessary:
        - order_service_catalog_item
        - query_asset_inventory
        - read_dashboard_metric
        - read_user_directory
        - search_knowledge_base
  - role: incident_operations_analyst
    description: Routes the project conflict incident to the appropriate governance owner.
    system_prompt: You are the incident operations analyst. Retrieve the conflict incident using query key orchid_allocation_conflict_r7 and assign it to Portfolio Governance with a clear note reflecting the policy boundary.
    tool_necessity:
      required:
        - assign_work_record
        - query_work_records
      forbidden:
        - create_followup_record
        - create_hardware_asset
        - create_user_account
        - delete_expense_line
        - optimize_budget_allocation
        - query_expense_lines
        - schedule_change_request
        - update_asset_assignment
      unnecessary:
        - order_service_catalog_item
        - query_asset_inventory
        - read_dashboard_metric
        - read_user_directory
        - search_knowledge_base
  - role: vendor_coordinator
    description: Creates the downstream portfolio reallocation follow-up.
    system_prompt: You are the vendor coordinator. Create one follow-up incident whose short description starts with Reallocation review and that documents the approved next step for the shared-investment conflict.
    tool_necessity:
      required:
        - create_followup_record
        - query_work_records
      forbidden:
        - assign_work_record
        - create_hardware_asset
        - create_user_account
        - delete_expense_line
        - optimize_budget_allocation
        - query_expense_lines
        - schedule_change_request
        - update_asset_assignment
      unnecessary:
        - order_service_catalog_item
        - query_asset_inventory
        - read_dashboard_metric
        - read_user_directory
        - search_knowledge_base
