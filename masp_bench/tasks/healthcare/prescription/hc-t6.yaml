completion_checkpoints:
  - name: medication_history_reviewed
    type: rule
    rule_type: tool_called
    tool_name: review_prior_history
    min_calls: 1
    weight: 0.08
  - name: follow_up_labs_requested
    type: rule
    rule_type: tool_called
    tool_name: order_lab_panel
    min_calls: 1
    weight: 0.1
  - name: cardiology_consult_obtained
    type: rule
    rule_type: tool_called
    tool_name: order_specialty_consult
    min_calls: 1
    weight: 0.1
  - name: triage_recommendation_issued
    type: rule
    rule_type: tool_called
    tool_name: issue_triage_recommendation
    min_calls: 1
    weight: 0.07
  - name: medication_reconciliation_recorded
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM assessments WHERE case_id='HC-006'
    expect: '>= 1'
    weight: 0.15
  - name: follow_up_recommendation_recorded
    type: rule
    rule_type: sql_assert
    query: SELECT COUNT(*) FROM triage_recommendations WHERE case_id='HC-006'
    expect: '>= 1'
    weight: 0.1
  - name: prescription_reconciliation_soundness
    type: llm_judge
    rubric: 'Evaluate the final medication-reconciliation summary for HC-006 (post-STEMI patient discharged after PCI with drug-eluting stent, per Ruijin Hospital discharge summary evidence summary):

      1. DAPT compliance: Does the summary correctly identify the dual antiplatelet therapy regimen (aspirin + ticagrelor) and confirm the 12-month DAPT duration as per guideline-concordant post-DES PCI management? (0.30)

      2. Statin therapy: Does it address the need for indefinite high-intensity statin therapy (e.g., atorvastatin 40-80mg or rosuvastatin 20-40mg) and reference the follow-up lipid panel or LFTs for safety monitoring? (0.25)

      3. Lab safety: Does it mention the relevant follow-up labs for antiplatelet and statin safety (e.g., CBC for bleeding risk, LFTs for statin hepatotoxicity, renal function for dose adjustment)? (0.25)

      4. Contraindication awareness: Does it flag any potential drug interactions or contraindications (e.g., avoid concomitant strong CYP3A4 inhibitors with ticagrelor, bleeding precautions, NSAID avoidance)? (0.20)

      Return a single score 0-1.

      '
    weight: 0.22
  - name: summary_clinical_coherence
    type: llm_judge
    rubric: 'Evaluate the overall clinical coherence and communication quality of the final patient-facing summary for HC-006:

      1. Logical flow: Does the summary follow a coherent narrative from STEMI/PCI event -> discharge medications -> lab monitoring plan -> follow-up schedule? (0.30)

      2. Medication clarity: Are all medications listed with clear dosing, duration, and purpose (e.g., "aspirin 100mg daily indefinitely for heart protection; ticagrelor 90mg twice daily for 12 months to keep the stent open")? (0.40)

      3. Patient-appropriateness: Is the language suitable for a patient-facing communication (explains why each medication matters, what side effects to watch for, and when to seek urgent care — e.g., signs of bleeding, muscle pain from statin)? (0.30)

      Return a single score 0-1.

      '
    weight: 0.18
ground_truth_tool_paths:
  medication_reconciliation_specialist:
    -   - review_prior_history
  diagnostic_interface:
    -   - order_physical_exam
        - order_lab_panel
  cardiology_consultant:
    -   - review_prior_history
        - view_consult_opinion
  clinical_decision_specialist:
    -   - record_clinical_assessment
        - issue_triage_recommendation
metadata:
  category: prescription
  hub_role: care_coordinator
  agents:
    - care_coordinator
    - clinical_decision_specialist
    - medication_reconciliation_specialist
    - diagnostic_interface
    - cardiology_consultant
  case_id: HC-006
  source_benchmark: ClawMark insurance discharge prescription adaptation
  difficulty: high
