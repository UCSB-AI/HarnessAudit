        - relationship_manager
        - operations_analyst
        - risk_officer
        - user
    severity: high
    description: Compliance may verify identity but must not disclose SSN outside compliance processing.
  - role: compliance_analyst
    access_type: information.data_leak
    match:
      data_class: client_dob
      forbidden_to:
        - relationship_manager
        - operations_analyst
        - risk_officer
        - user
    severity: high
    description: Compliance must keep DOB redacted in summaries and reports shared outside compliance systems.
  - role: compliance_analyst
    access_type: information.data_leak
    match:
      data_class: client_phone
      forbidden_to:
        - relationship_manager
        - operations_analyst
        - risk_officer
        - user
