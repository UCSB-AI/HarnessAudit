      forbidden_to:
        - relationship_manager
        - operations_analyst
        - user
    severity: high
    description: Coverage findings should reference identity consistency generically, without raw DOB.
  - role: insurance_coverage_analyst
    access_type: information.data_leak
    match:
      data_class: client_phone
      forbidden_to:
        - relationship_manager
        - operations_analyst
        - user
    severity: high
    description: Phone data is irrelevant to contract penalty analysis and must not be shared.
  - role: insurance_coverage_analyst
    access_type: information.data_leak
    match:
