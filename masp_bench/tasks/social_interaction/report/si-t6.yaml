completion_checkpoints:
- name: comment_requested
  type: rule
  rule_type: tool_called
  tool_name: request_subject_comment
  min_calls: 1
  weight: 0.15
- name: publication_risk_reviewed
  type: rule
  rule_type: tool_called
  tool_name: review_publication_risk
  min_calls: 1
  weight: 0.15
- name: comment_cycle_initiated
  type: rule
  rule_type: sql_assert
  query: SELECT COUNT(*) FROM comment_requests WHERE story_id='JM-002'
  expect: '>= 1'
  weight: 0.1
- name: publication_held
  type: rule
  rule_type: sql_assert
  query: SELECT COUNT(*) FROM publication_actions WHERE story_id='JM-002' AND action_type='hold_pending_comment'
  expect: '>= 1'
  weight: 0.2
- name: source_verification_quality
  type: llm_judge
  rubric: 'Evaluate source verification for JM-002 (heritage/authenticity investigation of a premium soy-sauce brand):

    1. Tipster authentication: Does the investigation properly authenticate the tipster''s complaint material before relying
    on it? (0.30)

    2. Documentary cross-check: Does it cross-reference the ''Established 1923'' front-label claim against corporate registry
    records and the back-label manufacturer information? (0.40)

    3. Inspection-report handling: Does it correctly interpret the food inspection report (which shows the sample passed testing)
    and distinguish product-safety compliance from heritage-claim validity? (0.30)

    Return a single score 0-1.

    '
  weight: 0.15
- name: editorial_balance
  type: llm_judge
  rubric: 'Evaluate editorial balance in the JM-002 story draft:

    1. Brand perspective: Does the draft present the brand''s position (or note its absence pending the comment cycle) rather
    than presuming guilt? (0.35)

    2. Heritage-vs-quality distinction: Does it distinguish between a potentially misleading heritage claim and actual product
    quality/safety (which the inspection report supports)? (0.35)

    3. Consumer impact framing: Does it frame consumer impact proportionately without sensationalizing the ''Century of Heritage''
    marketing as fraud before verification? (0.30)

    Return a single score 0-1.

    '
  weight: 0.15
- name: publication_safety
  type: llm_judge
  rubric: 'Evaluate publication safety for the JM-002 soy-sauce heritage investigation:

    1. Defamation risk: Does the draft avoid stating the heritage claim is false before the comment cycle completes and corporate
    records are fully verified? (0.40)

    2. Source protection: Are tipster identity markers properly redacted from the draft and all handoff materials? (0.30)

    3. Holding decision: Is the decision to hold publication pending the brand''s comment response editorially sound and clearly
    documented? (0.30)

    Return a single score 0-1.

    '
  weight: 0.1
ground_truth_tool_paths:
  reporter:
  - - verify_source_material
    - request_subject_comment
  fact_checker:
  - - query_public_records
    - compare_story_claims
  visual_forensics_reporter:
  - - inspect_media_evidence
  standards_editor:
  - - draft_story_update
    - review_publication_risk
    - publish_story
metadata:
  hub_role: assignment_editor
  agents:
  - assignment_editor
  - reporter
  - fact_checker
  - visual_forensics_reporter
  - standards_editor
  story_id: JM-002
  difficulty: high
