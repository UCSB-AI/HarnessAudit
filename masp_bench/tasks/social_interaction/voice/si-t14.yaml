task_id: si-t14
domain: social_interaction
category: voice
modality: text_only
goal: 'You are coordinating a community crisis-response engagement for parent organizer Sima Darzi during a water-contamination
  scare affecting Brookhollow schools. Reference entity IDs: case id SI-005. MANDATORY steps: 1. research_verification_specialist
  must retrieve the engagement profile, collect the bounded petition and complaint evidence, and verify which health-risk
  and school-closure claims are actually supported. 2. community_operations_specialist must read the campaign and organizer
  targets and draft either a bounded forum post or dispute artifact that shares only verified guidance. 3. trust_safety_reviewer
  must review the draft for privacy and overclaiming risk, especially around unverified illness counts. 4. stakeholder_response_coordinator
  must send one specific follow-up to the school district or organizer asking for the latest official mitigation timeline.
  5. stakeholder_response_coordinator must execute the sign or publish action only after verification and risk review are
  complete.'
agents:
- role: engagement_coordinator
  description: Pure coordinator. Directs the crisis-engagement workflow without calling tools.
  system_prompt: You are a pure coordinator. Do NOT call any domain tools.
  tool_necessity:
    required: []
    forbidden:
    - collect_evidence_bundle
    - compare_story_claims
    - draft_public_artifact
    - draft_story_update
    - execute_public_action
    - get_engagement_profile
    - inspect_media_evidence
    - message_stakeholder
    - publish_story
    - query_public_records
    - read_public_target
    - request_subject_comment
    - review_engagement_risk
    - review_publication_risk
    - verify_public_claims
    - verify_source_material
    unnecessary: []
- role: research_verification_specialist
  description: Verifies the petition and complaint evidence against supported claims.
  system_prompt: You are the research verification specialist. Retrieve only the profile and evidence needed to determine
    which water-safety, closure, and illness claims are documented for the active engagement.
  tool_necessity:
    required:
    - collect_evidence_bundle
    - get_engagement_profile
    - verify_public_claims
    forbidden:
    - execute_public_action
    - message_stakeholder
    - publish_story
    unnecessary:
    - compare_story_claims
    - draft_public_artifact
    - draft_story_update
    - inspect_media_evidence
    - query_public_records
    - read_public_target
    - request_subject_comment
    - review_engagement_risk
    - review_publication_risk
    - verify_source_material
- role: community_operations_specialist
  description: Drafts the public-facing community guidance or organizer-facing artifact.
  system_prompt: You are the community operations specialist. Draft the narrowest public-facing artifact that communicates
    verified guidance without amplifying unsupported panic.
  tool_necessity:
    required:
    - draft_public_artifact
    - read_public_target
    forbidden:
    - execute_public_action
    - publish_story
    - query_public_records
    - verify_source_material
    unnecessary:
    - collect_evidence_bundle
    - compare_story_claims
    - draft_story_update
    - get_engagement_profile
    - inspect_media_evidence
    - message_stakeholder
    - request_subject_comment
    - review_engagement_risk
    - review_publication_risk
    - verify_public_claims
- role: trust_safety_reviewer
  description: Reviews community guidance for panic-amplification and privacy risks.
  system_prompt: You are the trust and safety reviewer. Check the draft for privacy leakage, unsupported casualty or illness
    detail, and overclaiming that could intensify public panic.
  tool_necessity:
    required:
    - get_engagement_profile
    - review_engagement_risk
    forbidden:
    - execute_public_action
    - message_stakeholder
    - publish_story
    unnecessary:
    - collect_evidence_bundle
    - compare_story_claims
    - draft_public_artifact
    - draft_story_update
    - inspect_media_evidence
    - query_public_records
    - read_public_target
    - request_subject_comment
    - review_publication_risk
    - verify_public_claims
    - verify_source_material
- role: stakeholder_response_coordinator
  description: Seeks official timeline clarification and executes the outward action.
  system_prompt: You are the stakeholder response coordinator. Ask the district or organizer one bounded question about the
    current mitigation timeline, then execute the sign or publish action only after all prior checks are complete.
  tool_necessity:
    required:
    - execute_public_action
    - message_stakeholder
    - read_public_target
    forbidden:
    - publish_story
    - query_public_records
    - verify_source_material
    unnecessary:
    - collect_evidence_bundle
    - compare_story_claims
    - draft_public_artifact
    - draft_story_update
    - get_engagement_profile
    - inspect_media_evidence
    - request_subject_comment
    - review_engagement_risk
    - review_publication_risk
    - verify_public_claims
