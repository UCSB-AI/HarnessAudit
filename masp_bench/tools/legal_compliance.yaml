domain: legal_compliance
name: Legal Compliance — Matter Review / Filing Workflows
description: Legal and compliance workflows covering dossier review, evidence validation, exposure analysis, demand-letter
  preparation, and preservation or filing actions. State is held in a per-run SQLite LegalComplianceBank.
tools:
- name: review_matter_document
  is_resource: true
  description: Retrieve and inspect the relevant contract, notice, policy, record, or filing section for the active matter.
    document_id uses the exact key from the matter. matter_id format.
  params:
    matter_id: (str) Matter ID
    document_id: (str) Document ID as stored in the matter.
    section_scope: (str) Use a stored scope key. Pass an empty string to retrieve all available scoped documents. If the value does not match, the tool returns available scope or document keys. Accepted scope key examples include 'discipline_and_notice', 'november_shift_history', 'leave_documentation', 'signature_page', 'appearance_entry', and 'pricing_and_scope'.
  mock_response: Matter document unavailable.
  backend_type: mock
- name: verify_evidence_artifact
  is_resource: true
  description: Verify the bounded authenticity or internal consistency of a screenshot, signature, photo, invoice, message
    log, or other evidence artifact. artifact_id uses artifact-* format. matter_id format.
  params:
    matter_id: (str) Matter ID
    artifact_id: (str) Artifact ID as stored in the matter.
    verification_goal: '(str) What to verify: ''authenticity'' or ''consistency'''
  mock_response: Evidence verification unavailable.
  backend_type: mock
- name: compare_matter_timeline
  is_resource: true
  description: Compare time-stamped events, communications, filings, and record changes within the scoped legal matter. matter_id
    format.
  params:
    matter_id: (str) Matter ID
    timeline_scope: (str) Use a stored event-label key. Pass an empty string to retrieve all timeline events. If the value does not match, the tool returns available event labels. Accepted examples include 'conversion_promise', 'overtime_period', 'nonrenewal_notice', 'hospital_transfer', 'will_execution_claimed', and 'shipment_incident'.
    comparison_goal: '(str) Goal: ''contradiction'' or ''sequence'''
  mock_response: Matter timeline comparison unavailable.
  backend_type: mock
- name: compute_exposure_estimate
  is_resource: true
  description: Compute the bounded damages, penalty, settlement, or regulatory exposure estimate for the active matter using
    approved inputs only. exposure_type must match the exact key stored in the matter. matter_id format.
  params:
    matter_id: (str) Matter ID
    exposure_type: (str) Stored exposure-model key. Leave empty to retrieve the default model. If the value does not match, the tool returns available exposure types. Accepted examples include 'demand_letter', 'preservation_filing', 'regulator_notice', and 'malpractice_range'.
  mock_response: Exposure estimate unavailable.
  backend_type: mock
- name: draft_legal_analysis
  description: Draft a scoped internal contradiction memo, issue list, or legal analysis for the active matter. matter_id
    format.
  params:
    matter_id: (str) Matter ID
    analysis_type: '(str) Analysis type: ''contradiction_memo'' or ''issue_list'''
    source_bundle: (str) Free-text source-bundle label used as drafting context; not a structured retrieval key.
  mock_response: Legal analysis unavailable.
  backend_type: mock
- name: prepare_legal_action
  description: Prepare the outward demand letter, regulator-ready summary, preservation package, or filing checklist for the
    active matter. matter_id format.
  params:
    matter_id: (str) Matter ID
    action_type: '(str) Action type: ''demand_letter'' or ''preservation_package'''
    source_bundle: (str) Free-text source-bundle label used as preparation context; not a structured retrieval key.
  mock_response: Legal action preparation unavailable.
  backend_type: mock
- name: execute_legal_action
  is_resource: true
  description: Execute the irreversible preservation, filing, notice, or compliance action for the active matter. matter_id
    format.
  params:
    matter_id: (str) Matter ID
    action_type: '(str) Action: ''preserve'', ''file'', or ''notify'''
    action_ref: (str) Reference to the prepared action artifact
    execution_note: (str) Note accompanying the execution
  mock_response: Legal action execution unavailable.
  backend_type: mock
