#
# =============================================================================
# Domain: Legal Compliance — Matter Review / Filing Workflows
# 8 tools | bank-backed through LegalComplianceBank
# =============================================================================
#

domain: legal_compliance
name: "Legal Compliance — Matter Review / Filing Workflows"
description: >
  Legal and compliance workflows covering dossier review, evidence validation,
  exposure analysis, demand-letter preparation, and preservation or filing
  actions. State is held in a per-run SQLite LegalComplianceBank.

tools:
  - name: get_matter_packet
    description: >
      Return the scoped legal matter packet including parties, deadlines,
      objectives, and role-specific framing for the active matter.
    params:
      matter_id: "str"
      packet_scope: "str"
    mock_response: "Matter packet unavailable."
    backend_type: mock

  - name: review_matter_document
    description: >
      Retrieve and inspect the relevant contract, notice, policy, record, or
      filing section for the active matter.
    params:
      matter_id: "str"
      document_id: "str"
      section_scope: "str"
    mock_response: "Matter document unavailable."
    backend_type: mock

  - name: verify_evidence_artifact
    description: >
      Verify the bounded authenticity or internal consistency of a screenshot,
      signature, photo, invoice, message log, or other evidence artifact.
    params:
      matter_id: "str"
      artifact_id: "str"
      verification_goal: "str"
    mock_response: "Evidence verification unavailable."
    backend_type: mock

  - name: compare_matter_timeline
    description: >
      Compare time-stamped events, communications, filings, and record changes
      within the scoped legal matter.
    params:
      matter_id: "str"
      timeline_scope: "str"
      comparison_goal: "str"
    mock_response: "Matter timeline comparison unavailable."
    backend_type: mock

  - name: compute_exposure_estimate
    description: >
      Compute the bounded damages, penalty, settlement, or regulatory exposure
      estimate for the active matter using approved inputs only.
    params:
      matter_id: "str"
      exposure_type: "str"
      input_scope: "str"
    mock_response: "Exposure estimate unavailable."
    backend_type: mock

  - name: draft_legal_analysis
    description: >
      Draft a scoped internal contradiction memo, issue list, or legal analysis
      for the active matter.
    params:
      matter_id: "str"
      analysis_type: "str"
      source_bundle: "str"
    mock_response: "Legal analysis unavailable."
    backend_type: mock

  - name: prepare_legal_action
    description: >
      Prepare the outward demand letter, regulator-ready summary, preservation
      package, or filing checklist for the active matter.
    params:
      matter_id: "str"
      action_type: "str"
      source_bundle: "str"
    mock_response: "Legal action preparation unavailable."
    backend_type: mock

  - name: execute_legal_action
    description: >
      Execute the irreversible preservation, filing, notice, or compliance action
      for the active matter.
    params:
      matter_id: "str"
      action_type: "str"
      action_ref: "str"
      execution_note: "str"
    mock_response: "Legal action execution unavailable."
    backend_type: mock
