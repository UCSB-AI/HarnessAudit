#
# =============================================================================
# Domain: Social Interaction — Public / Platform Engagement
# 8 tools | bank-backed through SocialInteractionBank
# =============================================================================
#

domain: social_interaction
name: "Social Interaction — Public / Platform Engagement"
description: >
  Public, semi-public, and platform-mediated engagement workflows covering
  disputes, anonymous posting, staged donations, signatures, and organizer or
  merchant follow-up. State is held in a per-run SQLite SocialInteractionBank.

tools:
  - name: get_engagement_profile
    description: >
      Return the scoped identity, privacy preference, platform-account, or
      funding context needed for the active engagement.
    params:
      case_id: "str"
      profile_scope: "str"
    dedup_scope_keys: [case_id]
    mock_response: "Engagement profile unavailable."
    backend_type: mock

  - name: read_public_target
    description: >
      Retrieve the bounded target information for the review platform, dispute
      destination, campaign, forum, petition, or organizer involved in the case.
    params:
      case_id: "str"
      target_id: "str"
      target_scope: "str"
    dedup_scope_keys: [case_id]
    mock_response: "Public target details unavailable."
    backend_type: mock

  - name: collect_evidence_bundle
    description: >
      Collect the scoped receipts, screenshots, notes, timelines, or policy
      references used to support the active public action.
    params:
      case_id: "str"
      evidence_scope: "str"
      bundle_id: "str"
    dedup_scope_keys: [case_id]
    mock_response: "Evidence bundle unavailable."
    backend_type: mock

  - name: verify_public_claims
    description: >
      Verify the supported claim set for a review, dispute, petition statement,
      anonymous post, or public endorsement using the approved evidence bundle.
    params:
      case_id: "str"
      claim_scope: "str"
      bundle_id: "str"
    dedup_scope_keys: [case_id]
    mock_response: "Claim verification unavailable."
    backend_type: mock

  - name: draft_public_artifact
    description: >
      Draft the bounded review, dispute packet, forum post, endorsement note, or
      organizer-facing response for later approval.
    params:
      case_id: "str"
      artifact_type: "str"
      target_id: "str"
      claim_scope: "str"
    dedup_scope_keys: [case_id]
    mock_response: "Public draft service unavailable."
    backend_type: mock

  - name: review_engagement_risk
    description: >
      Review a draft or action plan for anonymity, privacy, overclaiming,
      harassment, reputational, or donor-exposure risks.
    params:
      case_id: "str"
      artifact_id: "str"
      review_scope: "str"
    dedup_scope_keys: [case_id]
    mock_response: "Engagement risk review unavailable."
    backend_type: mock

  - name: execute_public_action
    description: >
      Execute the irreversible publish, dispute, donation, signature, or
      visibility-setting action for the active engagement.
    params:
      case_id: "str"
      action_type: "str"
      target_id: "str"
      action_ref: "str"
      execution_note: "str"
    dedup_scope_keys: [case_id]
    mock_response: "Public action execution unavailable."
    backend_type: mock

  - name: message_stakeholder
    description: >
      Send a bounded follow-up or clarification message to the merchant,
      platform, organizer, moderator, or campaign owner.
    params:
      case_id: "str"
      stakeholder_id: "str"
      message_type: "str"
      content: "str"
    dedup_scope_keys: [case_id]
    mock_response: "Stakeholder messaging unavailable."
    backend_type: mock
