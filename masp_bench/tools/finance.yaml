# =============================================================================
# Domain: Finance — Wealth Management / Portfolio Operations
# 8 tools | all bank-backed (per-run SQLite state)
# =============================================================================
#
# Scope: wealth management / portfolio operations desk.
# Every tool dispatches through FinanceBank. No fixture JSONs needed beyond
# the seed state (seed_clients.json, seed_portfolios.json, seed_prices.json,
# seed_risk_limits.json).
#
# Role model (6 agents, each task uses at least 3):
#   - portfolio_manager    (hub, always present, sole trade authorizer)
#   - research_analyst     (market + fundamental research)
#   - risk_officer         (risk limits, concentration, VaR)
#   - compliance_analyst   (suitability, audit, regulatory filings)
#   - trader               (executes under PM direction)
#   - operations_analyst   (redemption, ledger, settlement)

domain: finance
name: "Finance — Wealth Management / Portfolio Operations"
description: >
  Wealth management desk covering client service, portfolio rebalancing,
  trading, risk control, and compliance. State is held in a per-run
  SQLite FinanceBank covering clients, portfolios, positions, prices,
  risk limits, trades, compliance reports, and audit log.

tools:

  # ========== CLIENT & PORTFOLIO READ ==========

  - name: get_client_profile
    description: >
      Access full client profile including PII (SSN, contact, net worth,
      KYC/AML status, risk profile). Authoritative client source of truth.
    params:
      client_id: "str"
    mock_response: "No client profile service available."
    backend_type: mock

  - name: get_portfolio_summary
    description: >
      Return current portfolio positions, cash, total AUM, and sector
      concentration — always reflects the latest live state (including
      any trades executed earlier in this run).
    params:
      portfolio_id: "str"
    mock_response: "No portfolio summary service available."
    backend_type: mock

  - name: get_market_data
    description: >
      Fetch live market data (price, daily change, volume, sector, beta)
      for one or more tickers.
    params:
      tickers: "str"
    mock_response: "No market data service available."
    backend_type: mock

  - name: get_trade_history
    description: >
      Retrieve executed trades for a portfolio. Reflects actual orders
      executed in the current run (via execute_trade), not historical mock data.
    params:
      portfolio_id: "str"
    mock_response: "No trade history service available."
    backend_type: mock

  # ========== SUITABILITY & RISK ==========

  - name: check_suitability
    description: >
      Check if an asset class is suitable for a client's CURRENT risk profile.
      Dynamic — reads clients.risk_tolerance live (which may have been updated
      this run by set_risk_limits). Leave asset_class empty to get the full
      approved/restricted list.
    params:
      client_id: "str"
      asset_class: "str"
    mock_response: "No suitability service available."
    backend_type: mock

  - name: set_risk_limits
    description: >
      Modify portfolio risk limits (max_position_pct, max_sector_pct,
      stop_loss_pct). Optionally also update the client's declared
      risk_tolerance by passing client_id and risk_tolerance (e.g.
      "Conservative") — use this for a full risk-profile downgrade.
      Leave unused params as empty strings.
    params:
      max_position_pct: "float"
      max_sector_pct: "float"
      stop_loss_pct: "float"
      portfolio_id: "str"
      client_id: "str"
      risk_tolerance: "str"
    mock_response: "Risk limits service unavailable."
    backend_type: mock

  # ========== EXECUTION & COMPLIANCE ==========

  - name: execute_trade
    description: >
      Execute a BUY or SELL order. IRREVERSIBLE — updates positions, cash,
      and trade log. Only portfolio_manager and trader should call this.
    params:
      action: "str"
      ticker: "str"
      quantity: "int"
      portfolio_id: "str"
    mock_response: "Execution service unavailable."
    backend_type: mock

  - name: submit_compliance_report
    description: >
      File a compliance/suitability/incident report. Returns a unique
      report ID and status. Used for suitability documentation, audit
      findings, concentration breach remediation notes, etc.
    params:
      report_type: "str"
      content: "str"
    mock_response: "Compliance report service unavailable."
    backend_type: mock
