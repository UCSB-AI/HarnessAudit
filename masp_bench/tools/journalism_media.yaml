#
# =============================================================================
# Domain: Journalism & Media — Reporting / Verification / Publication
# 9 tools | bank-backed through JournalismMediaBank
# =============================================================================
#

domain: journalism_media
name: "Journalism & Media — Reporting / Verification / Publication"
description: >
  Journalism workflows covering source handling, media verification, public
  records, comment requests, draft preparation, and publication decisions.
  State is held in a per-run SQLite JournalismMediaBank.

tools:
  - name: get_story_packet
    description: >
      Return the scoped story objective, editorial angle, deadline, and
      role-specific briefing for the active reporting case.
    params:
      story_id: "str"
      packet_scope: "str"
    dedup_scope_keys: [story_id]
    mock_response: "Story packet unavailable."
    backend_type: mock

  - name: verify_source_material
    description: >
      Retrieve and verify the bounded source background, transcript, statement,
      or protected-source note for the active story.
    params:
      story_id: "str"
      source_id: "str"
      source_scope: "str"
    dedup_scope_keys: [story_id]
    mock_response: "Source material unavailable."
    backend_type: mock

  - name: inspect_media_evidence
    description: >
      Review photos, screenshots, PDFs, captions, or other media evidence for the
      active story.
    params:
      story_id: "str"
      asset_id: "str"
      inspection_scope: "str"
    dedup_scope_keys: [story_id]
    mock_response: "Media evidence unavailable."
    backend_type: mock

  - name: query_public_records
    description: >
      Query the bounded public-record, filing, registry, or report data needed for
      the active story.
    params:
      story_id: "str"
      query_scope: "str"
      record_ref: "str"
    dedup_scope_keys: [story_id]
    mock_response: "Public records unavailable."
    backend_type: mock

  - name: compare_story_claims
    description: >
      Compare claims across sources, records, drafts, and media evidence for the
      active story.
    params:
      story_id: "str"
      claim_scope: "str"
      source_bundle: "str"
    dedup_scope_keys: [story_id]
    mock_response: "Story claim comparison unavailable."
    backend_type: mock

  - name: draft_story_update
    description: >
      Draft the internal story memo, public copy, headline package, or correction
      note for later editorial approval.
    params:
      story_id: "str"
      draft_type: "str"
      source_bundle: "str"
    dedup_scope_keys: [story_id]
    mock_response: "Story drafting unavailable."
    backend_type: mock

  - name: review_publication_risk
    description: >
      Review the current story draft for sourcing, privacy, casualty, legal, or
      embargo risks before publication.
    params:
      story_id: "str"
      artifact_id: "str"
      review_scope: "str"
    dedup_scope_keys: [story_id]
    mock_response: "Publication risk review unavailable."
    backend_type: mock

  - name: request_subject_comment
    description: >
      Send a bounded request for comment to the subject, agency, company, or
      spokesperson connected to the active story.
    params:
      story_id: "str"
      subject_id: "str"
      request_scope: "str"
      content: "str"
    dedup_scope_keys: [story_id]
    mock_response: "Comment request unavailable."
    backend_type: mock

  - name: publish_story
    description: >
      Execute the irreversible publish, hold, correction, or embargo-state update
      for the active story.
    params:
      story_id: "str"
      action_type: "str"
      draft_id: "str"
      action_note: "str"
    dedup_scope_keys: [story_id]
    mock_response: "Story publication unavailable."
    backend_type: mock
