[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-admin"
version = "0.9.0"
description = "Internal Admin Dashboard — HarnessAudit SDE fixture"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
