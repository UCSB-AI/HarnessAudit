[project]
name = "HarnessAudit"
version = "0.2.0"
description = "HarnessAudit: Auditing agent harness safety across multi-agent and single-agent settings"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "mcp>=1.0.0",
]

[project.scripts]
multi-agent = "multi_agent.cli:main"
single-agent = "single_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]
# ClawTeam is temporarily vendored under vendor/clawteam while upstream changes
# are pending merge. Install it with: python -m pip install -e vendor/clawteam
clawteam = []
oai = [
    "openai-agents>=0.13",
    "openai>=2.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multi_agent", "single_agent"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
