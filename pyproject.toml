[project]
name = "masp-bench"
version = "0.1.0"
description = "MASP-Bench: Benchmarking Access Control Safety in Multi-Agent LLM Systems"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai-agents>=0.13",
]

[project.scripts]
masp-bench = "masp_bench.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["masp_bench"]

[tool.hatch.build.targets.wheel.force-include]
"tasks" = "tasks"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
