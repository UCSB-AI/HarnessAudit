[project]
name = "HarnessAudit-Bench"
version = "0.2.0"
description = "HarnessAudit-Bench: Auditing agent harness safety across multi-agent and single-agent settings"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "mcp>=1.0.0",
]

[project.scripts]
masp = "masp.cli:main"
sasp = "sasp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]
clawteam = [
    "clawteam",
]
oai = [
    "openai-agents>=0.13",
    "openai>=2.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["masp", "sasp"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
